<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Круговой тренер</title>
<meta name="description" content="Домашние тренировки: таймер с голосом, программы со своим весом, резинкой, гантелями и штангой, рабочие веса, журнал и замеры тела">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Тренер">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3F4EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121813" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800;900&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: dark-green hero card on top, tab panel, wide grid of programs on desktop (one column on phones); full-screen timer in the same card language */
:root{
  --bg:#F3F4EE; --surface:#FFFFFF; --soft:#EEF0E6; --line:#E1E4D8; --fg:#20291F; --muted:#5F685C;
  --accent:#202D24; --accent-ink:#FFFFFF;
  --cta:#C3F368; --cta-ink:#20291F; --cta-hover:#B3E853;
  --hero:#202D24; --hero-ink:#F3F4EE; --hero-muted:#AEB9A8; --hero-line:rgba(195,243,104,.22);
  --work:#E0533A; --rest:#2E9A68; --track:#E6E9DE; --far:#B4BBAC; --band:#EF7D1A; --plate:#2F5A3E;
  --shadow:0 1px 2px rgba(32,41,31,.05),0 10px 30px -12px rgba(32,41,31,.14);
  --shadow-lg:0 2px 6px rgba(32,41,31,.06),0 22px 48px -18px rgba(32,41,31,.28);
  --r-card:24px; --r-ctl:14px;
  --f-display:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121813; --surface:#1B231D; --soft:#222C24; --line:#2C3830; --fg:#E8EDE3; --muted:#9BA798;
  --accent:#C3F368; --accent-ink:#1A2418; --cta:#C3F368; --cta-ink:#1A2418; --cta-hover:#D2F88A;
  --hero:#1E2B22; --hero-ink:#EEF2E9; --hero-muted:#9FAB9B; --hero-line:rgba(195,243,104,.2);
  --work:#FF7A5E; --rest:#6CD39C; --track:#2A352D; --far:#4E5B51; --band:#FFA04D; --plate:#A8D97A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.5); --shadow-lg:0 2px 6px rgba(0,0,0,.35),0 22px 48px -18px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121813; --surface:#1B231D; --soft:#222C24; --line:#2C3830; --fg:#E8EDE3; --muted:#9BA798;
  --accent:#C3F368; --accent-ink:#1A2418; --cta:#C3F368; --cta-ink:#1A2418; --cta-hover:#D2F88A;
  --hero:#1E2B22; --hero-ink:#EEF2E9; --hero-muted:#9FAB9B; --hero-line:rgba(195,243,104,.2);
  --work:#FF7A5E; --rest:#6CD39C; --track:#2A352D; --far:#4E5B51; --band:#FFA04D; --plate:#A8D97A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.5); --shadow-lg:0 2px 6px rgba(0,0,0,.35),0 22px 48px -18px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--f-body);margin:0;font-feature-settings:"tnum" 0;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
@media (min-width:720px){.wrap{padding-block:28px 80px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));gap:24px}}
h1{font:800 clamp(34px,8.5vw,60px)/1 var(--f-display);margin:0;letter-spacing:-.03em;text-wrap:balance}
h2{font:700 19px/1.25 var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{margin:0}
button,input{font-family:inherit}
button{-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--cta);outline-offset:2px;box-shadow:0 0 0 5px var(--accent)}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;background:var(--hero);color:var(--hero-ink);border-radius:28px;padding:28px 24px 24px;isolation:isolate;box-shadow:var(--shadow)}
@media (min-width:720px){.hero{padding:44px 44px 36px}}
.hero-ring{position:absolute;z-index:-1;pointer-events:none;width:min(62vw,340px);aspect-ratio:1;right:max(-120px,-22vw);top:50%;transform:translateY(-50%)}
.hero-ring svg{width:100%;height:100%;display:block;overflow:visible}
@media (max-width:719px){.hero-ring{width:210px;right:-96px;top:-58px;transform:none;opacity:.9}.hero h1,.sub{position:relative}.hero h1{max-width:8.5ch}.sub{max-width:30ch}}
@media (min-width:720px){.hero-ring{right:-40px;width:340px}}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font:700 12px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--cta);margin:0 0 14px}
.eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cta)}
@media (min-width:720px){.hero h1{max-width:12ch}}
.sub{color:var(--hero-muted);margin:14px 0 0;font-size:clamp(15px,2.2vw,18px);max-width:34ch}
.sync{display:inline-flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--hero-muted);margin:20px 0 0;background:rgba(255,255,255,.06);border:1px solid var(--hero-line);border-radius:99px;padding:6px 14px 6px 12px;max-width:100%}
.sync span{min-width:0}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--hero-muted);flex:none;margin-top:.5em}
.sync[data-s="cloud"] i{background:var(--cta)}
.sync[data-s="error"] i,.sync[data-s="full"] i{background:#FF8A6E}

/* ---------- tabs ---------- */
.tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:5px}
.tabs button{flex:1 1 auto;min-width:0;border:0;background:none;color:var(--muted);font:600 15px var(--f-body);padding:11px 14px;border-radius:15px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 14px -6px rgba(32,45,36,.6)}
@media (max-width:420px){.tabs button{font-size:14px;padding:10px 10px}}

/* ---------- shared pieces ---------- */
.list{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow);min-width:0}
@media (max-width:420px){.card{padding:18px}}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 15px var(--f-body);padding:12px 18px;border-radius:var(--r-ctl);cursor:pointer;text-align:center;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--far)}
.btn.primary{background:var(--cta);border-color:var(--cta);color:var(--cta-ink)}
.btn.primary:hover{background:var(--cta-hover);border-color:var(--cta-hover)}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--soft)}
.btn.danger{color:var(--work)}
.btn.sm{padding:8px 13px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.5;cursor:default}
.hint{font-size:14px;color:var(--muted);margin:0;max-width:70ch}
.note{font-size:13px;color:var(--muted);margin:0}
.empty{text-align:center;color:var(--muted);padding:32px 12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h2{color:var(--fg)}
.empty p{margin:0;max-width:44ch}
.err{color:var(--work);font-size:14px;margin:0}
.tag{display:inline-block;font:700 11px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--cta-ink);background:var(--cta);border-radius:99px;padding:6px 10px;vertical-align:4px;white-space:nowrap}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--soft);border:1px solid var(--line);color:var(--muted)}
.sect{font:700 12px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:8px 0 -4px}
.flash{background:var(--surface);border:1px solid var(--rest);border-radius:16px;padding:12px 16px;font-size:15px;margin:0;box-shadow:var(--shadow)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase;min-width:0}
input{font:500 16px var(--f-body);color:var(--fg);background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
input:focus{border-color:var(--accent);background:var(--surface)}
input[type=number],input[inputmode=decimal]{font-variant-numeric:tabular-nums}
.icon{width:40px;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:12px;color:var(--muted);cursor:pointer;font-size:18px}
.icon:hover{color:var(--work);border-color:var(--work)}

/* ---------- programs ---------- */
#v-programs.list{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
@media (min-width:900px){#v-programs.list{grid-template-columns:repeat(2,minmax(0,1fr))}}
#v-programs > .resume,#v-programs > #add-prog,#v-programs > .empty{grid-column:1/-1}
#add-prog{padding:18px;border-style:dashed;border-width:2px;background:none;border-radius:var(--r-card);color:var(--muted);font-size:16px}
#add-prog:hover{color:var(--fg);border-color:var(--accent)}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow);min-width:0}
@media (max-width:420px){.prog{padding:18px}}
.prog-head{display:flex;flex-direction:column;gap:8px;min-width:0}
.prog h2{font-size:22px;line-height:1.2}
.prog .meta{display:flex;flex-wrap:wrap;gap:6px}
.prog .meta span{font-size:13px;font-weight:600;color:var(--fg);background:var(--soft);border-radius:99px;padding:5px 11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pnote{font-size:14px;color:var(--muted);margin:0;max-width:64ch}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity;min-width:0;scrollbar-width:thin}
.tile{flex:0 0 112px;margin:0;display:flex;flex-direction:column;gap:6px;scroll-snap-align:start}
.tile svg{display:block;width:112px;height:84px;background:var(--soft);border:0;border-radius:16px}
.tile figcaption{font-size:12.5px;line-height:1.3;color:var(--fg);font-weight:500}
.tile figcaption span{display:block;color:var(--muted);font:600 12px var(--f-body);margin-top:3px;font-variant-numeric:tabular-nums}
.vlink{display:inline-flex;align-items:center;gap:4px;color:var(--fg);font:700 12px var(--f-body);text-decoration:none;margin-top:5px;border-bottom:2px solid var(--cta);width:fit-content}
.vlink svg{width:11px;height:11px;fill:currentColor}
.start-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:60px;border:0;border-radius:18px;background:var(--cta);color:var(--cta-ink);font:800 18px var(--f-body);letter-spacing:-.01em;cursor:pointer;padding:12px 18px;box-shadow:0 10px 24px -12px rgba(120,170,40,.9);transition:transform .12s,background .15s}
.start-btn:hover{background:var(--cta-hover)}
.start-btn:active{transform:scale(.98)}
.start-btn .pi{width:34px;height:34px;border-radius:50%;background:var(--cta-ink);color:var(--cta);display:grid;place-items:center;flex:none}
.start-btn .pi svg{width:15px;height:15px;fill:currentColor;margin-left:2px}
.start-btn .dur{font-weight:600;font-size:15px;opacity:.75;font-variant-numeric:tabular-nums}
.prog-actions{display:flex;gap:6px;justify-content:flex-end;margin-top:-4px}
.resume{border:2px solid var(--accent);box-shadow:var(--shadow-lg)}
.play{width:56px;height:56px;border-radius:50%;border:0;background:var(--cta);color:var(--cta-ink);cursor:pointer;display:grid;place-items:center}
.play svg{width:22px;height:22px;fill:currentColor}

/* ---------- editor ---------- */
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}.grid3 .f:first-child{grid-column:1/-1}}
.ex{display:grid;grid-template-columns:60px minmax(0,1fr) 84px minmax(0,150px) 40px;grid-template-areas:"th name sec rep del" "th vid vid vid vid";gap:8px 10px;align-items:center}
.ex .th{grid-area:th;align-self:start}
.ex input[data-f="name"]{grid-area:name}.ex input[data-f="work"]{grid-area:sec}.ex .erep{grid-area:rep}.ex .icon{grid-area:del}.ex .vurl{grid-area:vid}
@media (max-width:560px){.ex{grid-template-columns:52px minmax(0,1fr) minmax(0,1fr) 40px;grid-template-areas:"th name name name" "th sec rep del" "vid vid vid vid"}}
.ex .th svg{display:block;width:100%;height:auto;aspect-ratio:4/3;background:var(--soft);border-radius:12px}
.ex + .ex{border-top:1px solid var(--line);padding-top:12px}
.ex .vurl{font-size:14px;padding:9px 11px;min-width:0}
.ex .erep{font-size:14px;padding:9px 10px;min-width:0}

/* ---------- journal ---------- */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);min-width:0}
.stat:first-child{background:var(--hero);border-color:var(--hero);color:var(--hero-ink)}
.stat:first-child span{color:var(--hero-muted)}
.stat b{display:block;font:800 clamp(26px,6vw,36px)/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);min-width:0}
.day i{width:100%;aspect-ratio:1;max-width:56px;border-radius:12px;background:var(--track);display:block}
.day i.on{background:var(--cta);box-shadow:inset 0 0 0 2px var(--accent)}
.day.today span{color:var(--fg);font-weight:800}
.entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;padding:14px 0;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.entry > span:first-child{font-weight:600}
.entry small{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.entry .t{font:700 16px var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.ewts{grid-column:1/-1;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.wlist{display:flex;flex-direction:column}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 10px;cursor:pointer;color:var(--fg);font:inherit;border-radius:0}
.wrow:last-child{border-bottom:0}
.wrow[aria-pressed="true"]{background:var(--soft);border-radius:14px;border-bottom-color:transparent}
.wrow .wn{font-weight:600;min-width:0}
.wrow .wv{font:800 18px var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.wrow small{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.wrow .up{color:var(--rest);font-weight:700}
.chartwrap{position:relative;min-width:0}
.chartwrap svg{display:block;width:100%;height:auto;overflow:visible}
.ctip{position:absolute;pointer-events:none;background:var(--accent);color:var(--accent-ink);font:600 12px var(--f-body);padding:6px 9px;border-radius:9px;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px))}
.ctip span{font-weight:800;margin-left:4px;font-variant-numeric:tabular-nums}

/* ---------- body ---------- */
.bm-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:600px){.bm-grid{grid-template-columns:1fr 1fr}}
.bm{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 16px;cursor:pointer;color:var(--fg);font:inherit;display:flex;flex-direction:column;gap:2px;min-width:0;box-shadow:var(--shadow)}
.bm[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent),var(--shadow)}
.bm .l{font-size:13px;color:var(--muted);font-weight:600}
.bm b{font:800 24px/1.15 var(--f-mono);font-variant-numeric:tabular-nums}
.bm b small{font:500 13px var(--f-body);color:var(--muted);margin-left:3px}
.bm .dl{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.bform .full{grid-column:1/-1}
.bentry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.bentry:last-child{border-bottom:0}
.bentry .vals{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 16px;font:600 14px var(--f-mono);color:var(--fg);font-variant-numeric:tabular-nums}
.bentry .vals span{color:var(--muted);font-family:var(--f-body);font-weight:500;font-size:12.5px;margin-right:4px}
.bentry .nt{grid-column:1/-1;font-size:14px;color:var(--muted)}

/* ---------- duels ---------- */
.duel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);min-width:0}
.duel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.duel-head h2{min-width:0}
.duel-meta{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.duel-row{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.duel-row .who{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.duel-row .val{font:800 26px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.duel-row .val small{font:500 12px var(--f-body);color:var(--muted);margin-left:3px}
.duel-row .dbar{grid-column:2/-1;height:10px;background:var(--track);border-radius:5px;overflow:hidden}
.dbar i{display:block;height:100%;background:var(--far);border-radius:5px;min-width:4px}
.duel-row.lead .dbar i{background:var(--cta);box-shadow:inset 0 0 0 1px rgba(32,45,36,.25)}
.av{width:38px;height:38px;border-radius:50%;background:var(--track);grid-row:span 2;object-fit:cover;display:block}
.badge{font:800 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;padding:6px 11px;border-radius:99px;color:#fff;background:var(--work);white-space:nowrap}
.badge.win{background:var(--cta);color:var(--cta-ink)} .badge.lose,.badge.wait{background:var(--soft);color:var(--muted)} .badge.tie{background:var(--accent);color:var(--accent-ink)}
.stake{font-size:14px;background:var(--soft);border-radius:12px;padding:9px 12px;margin:0}
.seg{display:flex;gap:4px;background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:4px}
.seg button{flex:1;min-width:0;border:0;background:none;padding:10px 6px;border-radius:12px;font:600 14px var(--f-body);color:var(--muted);cursor:pointer}
.seg button[aria-checked="true"]{background:var(--accent);color:var(--accent-ink)}
.fgroup{display:flex;flex-direction:column;gap:8px}
.fgroup .hint{margin:0}

/* ---------- timer ---------- */
#runner{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;align-items:center;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));gap:12px;overflow-y:auto;overflow-x:hidden}
#runner > *{flex-shrink:0}
#runner .top{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:10px 10px 10px 18px}
#runner .prog-name{font:700 15px var(--f-body);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sndbtns{display:flex;gap:6px;flex:none}
.sound{font-size:13px;color:var(--hero-ink)!important;border:1px solid var(--hero-line)!important;background:rgba(255,255,255,.06)!important;padding:7px 11px!important}
.sound[aria-pressed="true"]{border-color:var(--cta)!important;color:var(--cta)!important}
.sound:disabled{opacity:.45}
.phase{font:800 13px var(--f-body);letter-spacing:.16em;text-transform:uppercase;padding:7px 16px;border-radius:99px;color:#fff;margin-top:4px}
.phase.work{background:var(--work)} .phase.rest{background:var(--rest)} .phase.prep{background:var(--accent);color:var(--accent-ink)} .phase.done{background:var(--cta);color:var(--cta-ink)}
.exname{font:800 clamp(22px,6vw,34px)/1.15 var(--f-display);letter-spacing:-.02em;margin:0;text-align:center;max-width:22ch;text-wrap:balance;min-height:1.15em}
.reps{font:700 16px var(--f-body);color:var(--cta-ink);background:var(--cta);border-radius:99px;padding:5px 14px;min-height:1.3em;margin-top:-2px;text-align:center;font-variant-numeric:tabular-nums;max-width:100%}
.reps:empty{display:none}
.wctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.wctl .wbtn{width:44px;height:44px;font:600 24px/1 var(--f-body)}
.wbox{display:flex;align-items:baseline;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px 12px;box-shadow:var(--shadow)}
.wbox input{width:4.2em;border:0;background:none;padding:2px 0;text-align:right;font:800 24px var(--f-mono);font-variant-numeric:tabular-nums}
.wbox input:focus{background:none}
.wbox input:focus-visible{outline:none;box-shadow:none}.wbox:focus-within{outline:3px solid var(--cta);outline-offset:2px}
.wbox span{font-size:14px;color:var(--muted)}
.wprev{flex-basis:100%;text-align:center;font-size:13px;color:var(--muted);min-height:1.2em}
.stage{display:flex;align-items:center;justify-content:center;gap:clamp(10px,4vw,40px);width:100%;max-width:820px}
.ring{position:relative;flex:0 0 auto;width:min(42vw,36vh,320px);aspect-ratio:1;max-width:100%;background:var(--surface);border-radius:50%;box-shadow:var(--shadow-lg)}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14%}
.clock{font:800 min(12.5vw,10vh,92px)/1 var(--f-mono);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.figbox{flex:0 1 auto;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.figbox svg{display:block;width:min(46vw,42vh,400px);aspect-ratio:4/3;height:auto;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.target{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;min-height:1.4em;text-align:center;flex-wrap:wrap;justify-content:center}
.target i{width:9px;height:9px;border-radius:50%;background:var(--work);display:inline-block}
.tip{font-size:15.5px;line-height:1.45;color:var(--muted);margin:0;max-width:44ch;text-align:center;min-height:2.8em}
.vbtn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--fg);border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:9px 18px;font:700 14px var(--f-body);box-shadow:var(--shadow)}
.vbtn svg{width:16px;height:16px;fill:var(--work)}
.counters{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;font:600 14px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.bar{width:100%;max-width:760px;height:8px;background:var(--track);border-radius:4px;overflow:hidden;flex:none}
.bar i{display:block;height:100%;background:var(--accent);width:0;border-radius:4px}
.next{color:var(--muted);font-size:15px;text-align:center}
.next b{color:var(--fg)}
.controls{display:flex;gap:12px;align-items:center;margin-top:2px}
.circ{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow);flex:none}
.circ svg{width:20px;height:20px;fill:currentColor}
.circ:disabled{opacity:.35;cursor:default}
.controls .play.big{width:84px;height:84px;box-shadow:0 14px 30px -12px rgba(110,160,30,.95)}
.controls .big svg{width:32px;height:32px}
.ctl-hint{font-size:12px;color:var(--muted);margin-top:-4px}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(18,26,20,.55);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:720px){.sheet{align-items:center}}
.sheet-card{background:var(--surface);color:var(--fg);border-radius:28px;padding:26px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-lg)}
.sheet-card h2{font-size:24px}
.sheet-card .btn{padding:15px 16px;font-size:16px}
@media (max-width:380px){.circ{width:50px;height:50px}.controls{gap:10px}.controls .play.big{width:76px;height:76px}}
@media (max-height:700px){.ring{width:min(40vw,32vh,300px)}.tip{min-height:0}}
@media (prefers-reduced-motion:no-preference){.ring circle.p{transition:stroke-dashoffset .25s linear}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="hero">
    <div class="hero-ring" aria-hidden="true"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="82" fill="none" stroke="#C3F368" stroke-width="22" stroke-dasharray="380 136" stroke-linecap="round" transform="rotate(-120 100 100)"/><circle cx="100" cy="100" r="82" fill="none" stroke="#C3F368" stroke-opacity=".16" stroke-width="22"/><circle cx="100" cy="100" r="46" fill="none" stroke="#C3F368" stroke-opacity=".32" stroke-width="2"/></svg></div>
    <p class="eyebrow">Домашние тренировки</p>
    <h1>Круговой тренер</h1>
    <p class="sub">Таймер с подсказками, программы со своим весом, резинкой, гантелями и штангой, журнал и прогресс</p>
    <p class="sync" id="sync" data-s="local" aria-live="polite"><i></i><span>Данные хранятся на этом устройстве</span></p>
  </header>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-programs" aria-selected="true" data-view="programs">Программы</button>
    <button role="tab" id="tab-edit" aria-selected="false" data-view="edit">Конструктор</button>
    <button role="tab" id="tab-log" aria-selected="false" data-view="log">Журнал</button>
    <button role="tab" id="tab-duel" aria-selected="false" data-view="duel">Дуэли</button>
    <button role="tab" id="tab-body" aria-selected="false" data-view="body">Тело</button>
  </div>
  <section id="v-programs" class="list"></section>
  <section id="v-edit" hidden></section>
  <section id="v-log" hidden></section>
  <section id="v-duel" class="list" hidden><p class="flash" id="duel-flash" hidden></p><div class="list" id="duel-list"></div><div id="duel-form"></div></section>
  <section id="v-body" class="list" hidden><div class="list" id="body-top"></div><div id="body-form"></div><div id="body-hist"></div></section>
</div>

<div id="runner" hidden>
  <div class="top">
    <span class="prog-name" id="r-name"></span>
    <div class="sndbtns"><button class="btn sm ghost sound" id="r-sound" aria-pressed="true">Звук: вкл</button><button class="btn sm ghost sound" id="r-voice" aria-pressed="true">Голос: вкл</button></div>
  </div>
  <span class="phase prep" id="r-phase">Приготовьтесь</span>
  <h2 class="exname" id="r-ex"></h2>
  <div class="reps" id="r-reps"></div>
  <div class="wctl" id="r-wt" hidden>
    <button class="circ wbtn" id="r-wminus" type="button" aria-label="Меньше на 2,5 кг">−</button>
    <label class="wbox"><input id="r-wval" type="text" inputmode="decimal" autocomplete="off" placeholder="—" aria-label="Рабочий вес, кг"><span>кг</span></label>
    <button class="circ wbtn" id="r-wplus" type="button" aria-label="Больше на 2,5 кг">+</button>
    <span class="wprev" id="r-wprev"></span>
  </div>
  <div class="stage">
  <div class="ring">
    <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="var(--track)" stroke-width="8"/>
      <circle class="p" id="r-arc" cx="60" cy="60" r="54" fill="none" stroke="var(--muted)" stroke-width="8" stroke-linecap="round" stroke-dasharray="339.29" stroke-dashoffset="0"/></svg>
    <div class="center"><div class="clock" id="r-clock">0:10</div></div>
  </div>
  <div class="figbox"><div id="r-fig"></div><div class="target" id="r-target"></div></div>
  </div>
  <p class="tip" id="r-tip"></p>
  <a class="vbtn" id="r-video" target="_blank" rel="noopener" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg><span>Видео: как делать правильно</span></a>
  <div class="counters"><span id="r-round"></span><span id="r-step"></span><span id="r-left"></span></div>
  <div class="bar"><i id="r-bar"></i></div>
  <div class="next" id="r-next"></div>
  <div class="controls">
    <button class="circ" id="r-stop" aria-label="Завершить"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
    <button class="circ" id="r-prev" aria-label="Назад к прошлому упражнению"><svg viewBox="0 0 24 24"><path d="M19 5l-9 7 9 7zM5 5h3v14H5z"/></svg></button>
    <button class="play big" id="r-toggle" aria-label="Пауза"></button>
    <button class="circ" id="r-skip" aria-label="Пропустить"><svg viewBox="0 0 24 24"><path d="M5 5l9 7-9 7zM16 5h3v14h-3z"/></svg></button>
  </div>
  <div class="ctl-hint">⏮ назад · ⏭ дальше · ■ выйти</div>
  <div class="sheet" id="r-confirm" hidden role="dialog" aria-modal="true" aria-labelledby="rc-title">
    <div class="sheet-card">
      <h2 id="rc-title">Завершить тренировку?</h2>
      <p class="hint" id="rc-sum"></p>
      <button class="btn primary" id="rc-resume">Нет, продолжить</button>
      <button class="btn" id="rc-later">Выйти и продолжить позже</button>
      <button class="btn ghost danger" id="rc-finish">Завершить и записать в журнал</button>
    </div>
  </div>
</div>

<script>
const ICON_PLAY='<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>';
const ICON_PAUSE='<svg viewBox="0 0 24 24"><rect x="6" y="4.5" width="4.5" height="15" rx="1"/><rect x="13.5" y="4.5" width="4.5" height="15" rx="1"/></svg>';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const uid=()=>Math.random().toString(36).slice(2,9);

const SAMPLES=[
 {id:'db1',name:"Ноги и ягодицы с гантелями",rounds:4,rest:45,restRound:90,tag:'Гантели',note:"Вес подбирайте так, чтобы последние 2 повтора давались тяжело. Для ног и спины гантели берите тяжелее, для плеч и рук — легче. Успели раньше сигнала — отдыхайте до конца времени.",items:[
  {name:"Гоблет-присед с гантелью",work:50,reps:"12–15",tip:"Гантель вертикально у груди. Таз назад и вниз, колени по направлению носков, пятки на полу"},
  {name:"Румынская тяга с гантелями",work:50,reps:"10–12",tip:"Гантели скользят вдоль бёдер до середины голени, таз уходит назад, спина прямая. Поднимайтесь за счёт ягодиц"},
  {name:"Выпады назад с гантелями, левая",work:45,reps:"10",tip:"Гантели в опущенных руках. Шаг назад, вес на передней пятке, корпус ровно"},
  {name:"Выпады назад с гантелями, правая",work:45,reps:"10",tip:"Гантели в опущенных руках. Шаг назад, вес на передней пятке, корпус ровно"},
  {name:"Ягодичный мост с гантелью",work:45,reps:"12–15",tip:"Гантель на тазу, придерживайте руками. Толкайтесь пятками, вверху пауза 2 секунды"},
  {name:"Болгарские выпады с гантелями, левая",work:45,reps:"8–10",tip:"Задняя нога на диване или стуле. Опускайтесь вниз, вес на передней пятке"},
  {name:"Болгарские выпады с гантелями, правая",work:45,reps:"8–10",tip:"Задняя нога на диване или стуле. Опускайтесь вниз, вес на передней пятке"},
  {name:"Подъёмы на носки с гантелями",work:40,reps:"15–20",tip:"Гантели в опущенных руках. Поднимайтесь высоко на носки, пауза наверху, опускайтесь медленно"}]},
 {id:'db2',name:"Руки с гантелями",rounds:3,rest:45,restRound:90,tag:'Гантели',note:"Вес подбирайте так, чтобы последние 2 повтора давались тяжело. Для ног и спины гантели берите тяжелее, для плеч и рук — легче. Успели раньше сигнала — отдыхайте до конца времени.",items:[
  {name:"Сгибания рук с гантелями на бицепс",work:45,reps:"10–12",tip:"Локти прижаты к бокам, ладони смотрят вверх. Без раскачки, вниз медленно"},
  {name:"Молотки с гантелями",work:45,reps:"10–12",tip:"Ладони смотрят друг на друга весь подход. Работают бицепс и предплечья"},
  {name:"Французский жим с гантелью лёжа на полу",work:45,reps:"10–12",tip:"Одна гантель двумя руками. Плечи неподвижны, опускайте гантель за голову, сгибая только локти"},
  {name:"Разгибание руки с гантелью в наклоне",work:45,reps:"12 на каждую руку",tip:"Корпус наклонён, локоть прижат к боку. Выпрямляйте руку назад до прямой линии, без маха"},
  {name:"Концентрированный подъём на бицепс",work:45,reps:"10 на каждую руку",tip:"Сидя, локоть упирается во внутреннюю часть бедра. Поднимайте гантель только сгибанием локтя"},
  {name:"Разгибание гантели из-за головы",work:45,reps:"12",tip:"Гантель двумя руками над головой. Локти смотрят вперёд, опускайте за голову и выпрямляйте руки"}]},
 {id:'db3',name:"Спина с гантелями",rounds:4,rest:45,restRound:90,tag:'Гантели',note:"Вес подбирайте так, чтобы последние 2 повтора давались тяжело. Для ног и спины гантели берите тяжелее, для плеч и рук — легче. Успели раньше сигнала — отдыхайте до конца времени.",items:[
  {name:"Становая тяга с гантелями",work:50,reps:"10–12",tip:"Гантели перед бёдрами. Спина прямая, таз назад, гантели вдоль ног вниз и вверх за счёт ног и ягодиц"},
  {name:"Тяга гантели в наклоне одной рукой, левая",work:45,reps:"10–12",tip:"Свободная рука и колено опираются на диван. Тяните гантель к поясу, локоть вдоль корпуса"},
  {name:"Тяга гантели в наклоне одной рукой, правая",work:45,reps:"10–12",tip:"Свободная рука и колено опираются на диван. Тяните гантель к поясу, локоть вдоль корпуса"},
  {name:"Тяга гантелей в наклоне двумя руками",work:45,reps:"10–12",tip:"Наклон около 45°, колени согнуты, спина прямая. Тяните гантели к поясу, сводя лопатки"},
  {name:"Шраги с гантелями",work:40,reps:"15",tip:"Руки прямые. Поднимайте плечи к ушам, пауза на секунду, без вращения"},
  {name:"Пуловер с гантелью лёжа на полу",work:45,reps:"12",tip:"Одна гантель в прямых руках над грудью. Опускайте за голову к полу и возвращайте, поясница прижата"}]},
 {id:'db4',name:"Плечи с гантелями",rounds:3,rest:45,restRound:90,tag:'Гантели',note:"Вес подбирайте так, чтобы последние 2 повтора давались тяжело. Для ног и спины гантели берите тяжелее, для плеч и рук — легче. Успели раньше сигнала — отдыхайте до конца времени.",items:[
  {name:"Жим гантелей стоя",work:50,reps:"10–12",tip:"Гантели у плеч, пресс и ягодицы напряжены. Выжимайте вверх, не прогибая поясницу"},
  {name:"Разведения гантелей в стороны",work:45,reps:"12–15",tip:"Руки слегка согнуты. Поднимайте через стороны до уровня плеч, без раскачки"},
  {name:"Подъём гантелей перед собой",work:45,reps:"12",tip:"Руки почти прямые. Поднимайте до уровня глаз поочерёдно или вместе"},
  {name:"Обратные разведения в наклоне с гантелями",work:45,reps:"12–15",tip:"Наклон почти параллельно полу, спина прямая. Разводите руки в стороны, сводя лопатки"},
  {name:"Жим Арнольда с гантелями",work:45,reps:"10",tip:"Начните с гантелями у груди ладонями к себе. Выжимая вверх, разворачивайте ладони вперёд"},
  {name:"Тяга гантелей к подбородку",work:40,reps:"12",tip:"Ведите локти в стороны и вверх до уровня плеч, гантели близко к телу"}]},
 {id:'db5',name:"Грудь с гантелями",rounds:3,rest:45,restRound:90,tag:'Гантели',note:"Вес подбирайте так, чтобы последние 2 повтора давались тяжело. Для ног и спины гантели берите тяжелее, для плеч и рук — легче. Успели раньше сигнала — отдыхайте до конца времени.",items:[
  {name:"Жим гантелей лёжа на полу",work:50,reps:"10–12",tip:"Лопатки сведены, локти под углом 45° к корпусу. Опускайте до касания локтями пола, выжимайте вверх"},
  {name:"Разведения гантелей лёжа на полу",work:45,reps:"12",tip:"Руки слегка согнуты. Разводите в стороны до касания пола локтями и сводите над грудью"},
  {name:"Пуловер с гантелью лёжа на полу",work:45,reps:"12",tip:"Одна гантель в прямых руках. Опускайте за голову, растягивая грудь, и возвращайте"},
  {name:"Жим гантелей узким хватом лёжа на полу",work:45,reps:"10–12",tip:"Гантели касаются друг друга, ладони смотрят друг на друга. Работают внутренняя часть груди и трицепс"},
  {name:"Отжимания с опорой на гантели",work:40,reps:"8–12",tip:"Ладони на рукоятках гантелей — можно опуститься глубже. Тело прямой линией"}]},
 {id:'db6',name:"Всё тело с гантелями",rounds:3,rest:45,restRound:90,tag:'Гантели',note:"Вес подбирайте так, чтобы последние 2 повтора давались тяжело. Для ног и спины гантели берите тяжелее, для плеч и рук — легче. Успели раньше сигнала — отдыхайте до конца времени.",items:[

 {id:'bb1',name:'Ягодицы со штангой',rounds:4,rest:60,restRound:90,tag:'Штанга и блины',note:'Дома без стоек и страховки: начинайте с пустого грифа и добавляйте блины, когда все повторы получаются с хорошей техникой. Последние 2 повтора должны даваться тяжело. Если успели раньше сигнала — отдыхайте до конца времени. Под гриф на тазу положите сложенное полотенце.',items:[
  {name:'Ягодичный мост со штангой',work:50,reps:'12–15',tip:'Гриф на сгибе таза поверх полотенца, держите руками. Толкайтесь пятками, вверху сожмите ягодицы на 2 секунды. Поясницу не прогибайте'},

  {name:'Гоблет-присед с блином',work:50,reps:'12–15',tip:'Блин прижат к груди. Таз назад и вниз, колени смотрят туда же, куда носки, пятки на полу'},

  {name:'Выпады назад с блином, левая',work:45,reps:'10',tip:'Блин у груди. Шаг назад, вес на передней пятке, колено задней ноги почти касается пола'},
  {name:'Выпады назад с блином, правая',work:45,reps:'10',tip:'Блин у груди. Шаг назад, вес на передней пятке, колено задней ноги почти касается пола'},
  {name:'Мост на одной ноге с блином, левая',work:40,reps:'12',tip:'Блин на тазу, придерживайте руками. Вторая нога вытянута, таз держите ровно'},
  {name:'Мост на одной ноге с блином, правая',work:40,reps:'12',tip:'Блин на тазу, придерживайте руками. Вторая нога вытянута, таз держите ровно'}]},
 {id:'bb2',name:'Руки со штангой',rounds:3,rest:60,restRound:90,tag:'Штанга и блины',note:'Дома без стоек и страховки: начинайте с пустого грифа и добавляйте блины, когда все повторы получаются с хорошей техникой. Последние 2 повтора должны даваться тяжело. Если успели раньше сигнала — отдыхайте до конца времени.',items:[

  {name:'Французский жим лёжа на полу',work:45,reps:'10–12',tip:'Лёжа на полу, узкий хват. Плечи неподвижны, сгибайте только локти, гриф опускается ко лбу. Начинайте с пустого грифа'},

 {id:'bb3',name:'Спина со штангой',rounds:4,rest:60,restRound:90,tag:'Штанга и блины',note:'Дома без стоек и страховки: начинайте с пустого грифа и добавляйте блины, когда все повторы получаются с хорошей техникой. Последние 2 повтора должны даваться тяжело. Если успели раньше сигнала — отдыхайте до конца времени. В тягах спина всё время прямая — если она округляется, вес слишком большой.',items:[
  {name:'Становая тяга',work:50,reps:'8–10',tip:'Гриф над серединой стопы. Спина прямая, грудь вперёд, встаёте ногами и тазом, гриф идёт вдоль ног'},
  {name:'Тяга штанги в наклоне',work:50,reps:'10–12',tip:'Наклон около 45°, колени согнуты, спина прямая. Тяните гриф к низу живота, сводя лопатки'},

 {id:'bb4',name:'Плечи со штангой',rounds:3,rest:60,restRound:90,tag:'Штанга и блины',note:'Дома без стоек и страховки: начинайте с пустого грифа и добавляйте блины, когда все повторы получаются с хорошей техникой. Последние 2 повтора должны даваться тяжело. Если успели раньше сигнала — отдыхайте до конца времени. Для жима стоя поднимайте гриф на грудь в два движения: с пола на бёдра, затем на грудь.',items:[
  {name:'Жим штанги стоя',work:50,reps:'8–10',tip:'Гриф на груди, ягодицы и пресс напряжены. Выжимайте вверх над головой, поясницу не прогибайте'},
  {name:'Тяга штанги к подбородку широким хватом',work:45,reps:'12',tip:'Хват шире плеч. Ведите локти в стороны и вверх до уровня плеч, не выше'},

 {id:'bb5',name:'Грудь со штангой',rounds:3,rest:60,restRound:90,tag:'Штанга и блины',note:'Дома без стоек и страховки: начинайте с пустого грифа и добавляйте блины, когда все повторы получаются с хорошей техникой. Последние 2 повтора должны даваться тяжело. Если успели раньше сигнала — отдыхайте до конца времени. Жим лёжа на полу — только с весом, который вы сами безопасно кладёте и снимаете. Не работайте до отказа без страхующего.',items:[

 {id:'r1',name:'Ягодицы с резинкой',rounds:3,rest:20,restRound:60,tag:'С мини-резинкой',

  {name:'Ягодичный мостик',work:45,band:'knees',tip:'Резинка над коленами. Разведите колени, поднимите таз до прямой линии от колен до плеч, вверху сожмите ягодицы на 2 секунды. Не прогибайте поясницу, толкайтесь пятками'},
  {name:'«Раскладушка», левая',work:40,band:'knees',tip:'Резинка над коленами. Лёжа на боку, колени под 90°, стопы вместе. Поднимайте верхнее колено, задержка на секунду. Таз не заваливается назад'},
  {name:'«Раскладушка», правая',work:40,band:'knees',tip:'Резинка над коленами. Лёжа на боку, колени под 90°, стопы вместе. Поднимайте верхнее колено, задержка на секунду. Таз не заваливается назад'},
  {name:'«Ослик», левая',work:35,band:'knees',tip:'На четвереньках, ладони под плечами. Согнутую ногу поднимайте пяткой к потолку до параллели бедра с полом. Без прогиба и маха по инерции'},
  {name:'«Ослик», правая',work:35,band:'knees',tip:'На четвереньках, ладони под плечами. Согнутую ногу поднимайте пяткой к потолку до параллели бедра с полом. Без прогиба и маха по инерции'},
  {name:'«Пожарный гидрант», левая',work:35,band:'knees',tip:'На четвереньках отводите согнутую ногу в сторону до уровня таза, корпус не разворачивайте. Медленно возвращайте'},
  {name:'«Пожарный гидрант», правая',work:35,band:'knees',tip:'На четвереньках отводите согнутую ногу в сторону до уровня таза, корпус не разворачивайте. Медленно возвращайте'},
  {name:'Шаги в сторону в полуприседе',work:45,band:'ankles',tip:'Резинка на щиколотках или над коленами. Неглубокий присед, 10 шагов вправо и 10 влево, не выпрямляясь. Колени не заваливаются внутрь'},
  {name:'Приседания',work:45,band:'knees',tip:'Резинка над коленами. Стопы чуть шире плеч, таз назад, колени активно разводите в стороны. Вверху сожмите ягодицы'},
  {name:'Отведение ноги назад стоя, левая',work:35,band:'ankles',tip:'Резинка на щиколотках. Держитесь за стену, корпус слегка вперёд. Прямую ногу отводите назад от ягодицы, без прогиба в пояснице'},
  {name:'Отведение ноги назад стоя, правая',work:35,band:'ankles',tip:'Резинка на щиколотках. Держитесь за стену, корпус слегка вперёд. Прямую ногу отводите назад от ягодицы, без прогиба в пояснице'},
  {name:'Мост на одной ноге, левая',work:35,tip:'Без резинки или с лёгкой. Одна нога вытянута, толкайтесь пяткой опорной ноги, таз держите ровно. Это финишер'},
  {name:'Мост на одной ноге, правая',work:35,tip:'Без резинки или с лёгкой. Одна нога вытянута, толкайтесь пяткой опорной ноги, таз держите ровно. Это финишер'}]},
 {id:'w2',name:'Заминка: растяжка',rounds:1,rest:5,restRound:0,tag:'5 минут',note:'После тренировки ягодиц. Тянитесь мягко, без боли. При боли в коленях, пояснице или тазобедренном суставе сначала покажитесь врачу или тренеру.',items:[

const clone=o=>JSON.parse(JSON.stringify(o));
const cloud={col:null,uid:null,docs:{},chains:{},merged:false,
  write(id,data){if(!this.col)return;const body=clone(data);
    const run=()=>this.col?this.col.doc(id).set(body).then(()=>{if(this.merged)setSync('cloud')}).catch(e=>{const c=e&&e.code;
      if(c==='invalid_argument'){this.col=null;setSync('noaccess')}
      else if(c==='not_granted'||c==='revoked'||c==='capability_disabled'||c==='capability_removed'){this.col=null;setSync('local')}
      else if(c==='quota_exceeded')setSync('full');else setSync('error')}):null;
    this.chains[id]=(this.chains[id]||Promise.resolve()).then(run,run)},
  writePrograms(){this.write('programs',{items:programs,seeded:SAMPLES.map(p=>p.id),updatedAt:Date.now()})},

function mergeLocal(docs){
  const flag='ct-merged-'+cloud.uid;if(store.get(flag,false))return;
  if(!docs.programs){docs.programs={items:clone(programs)};cloud.writePrograms()}
  else{const remote=docs.programs.items||[];const sampleIds=SAMPLES.map(p=>p.id);
    const extra=programs.filter(p=>!sampleIds.includes(p.id)&&!remote.some(x=>x.id===p.id));
    if(extra.length){docs.programs={items:[...remote,...clone(extra)]};programs=docs.programs.items;cloud.writePrograms()}}
  const byMonth={};log.forEach(e=>{(byMonth[monthKey(e.at)]=byMonth[monthKey(e.at)]||[]).push(e)});
  for(const k in byMonth){const remote=(docs[k]&&docs[k].entries)||[];const add=byMonth[k].filter(e=>!remote.some(x=>x.at===e.at));
    if(add.length){docs[k]={entries:[...remote,...add].sort((a,b)=>a.at-b.at)};cloud.docs[k]=docs[k];cloud.write(k,docs[k])}}
  store.set(flag,true);
}
function onCloud(snap){
  if(!cloud.merged&&snap.metadata.fromCache)return;
  const docs={};snap.docs.forEach(d=>{if(d.exists)docs[d.id]=clone(d.data())});
  cloud.docs=docs;
  if(!cloud.merged){mergeLocal(docs);cloud.merged=true;setSync('cloud')}
  if(docs.programs&&Array.isArray(docs.programs.items)){
    const seeded=Array.isArray(docs.programs.seeded)?docs.programs.seeded:['g1','g2','s1','s2','s3'];
    const add=SAMPLES.filter(sp=>!seeded.includes(sp.id)&&!docs.programs.items.some(p=>p.id===sp.id));
    programs=docs.programs.items;
    if(add.length||!Array.isArray(docs.programs.seeded)){
      const firstOld=programs.findIndex(p=>p.id==='s1');const at=0;
      programs=[...programs.slice(0,at),...add.map(cloneP),...programs.slice(at)];docs.programs.items=programs;
      if(!cloud.seedWritten){cloud.seedWritten=true;cloud.writePrograms()}}
    if(migrateSamples(programs)&&!cloud.repsMigrated){cloud.repsMigrated=true;cloud.writePrograms()}
  }
  if(docs.body&&Array.isArray(docs.body.entries)){body=docs.body.entries;store.set('ct-body',body)}
  else if(body.length&&!cloud.bodyPushed){cloud.bodyPushed=true;cloud.write('body',{entries:body})}
  log=Object.keys(docs).filter(k=>k.startsWith('log-')).flatMap(k=>docs[k].entries||[]).sort((a,b)=>a.at-b.at);
  store.set('ct-programs',programs);store.set('ct-log',log);
  if(view==='programs')renderPrograms();if(view==='log')renderLog();if(view==='duel')renderDuels();if(view==='body')renderBody();
  scheduleScores();
}
async function initCloud(){
  if(!window.claude||typeof window.claude.use!=='function'){setSync('local');return}
  setSync('connecting');
  try{const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    const id=user?await user.id():null;
    if(!db||!id){setSync('local');return}
    let canWrite=null;try{canWrite=typeof user.can==='function'?await user.can('data.write'):null}catch(e){}
    duel.user=user;
    if(canWrite===false){duel.blocked=true;setSync('noaccess');return}
    cloud.uid=id;cloud.col=db.collection('data/users/'+id);
    cloud.col.onSnapshot(onCloud,e=>{setSync(e&&e.code==='revoked'?'local':'error')});
    startDuels(db,id);
  }catch(e){setSync('local')}
}

function duelScoresFor(d){const es=log.filter(e=>e.at>=d.startAt&&e.at<=d.endAt);
  return {workouts:es.filter(e=>e.full).length,minutes:Math.floor(es.reduce((a,e)=>a+(e.sec||0),0)/60),exercises:es.reduce((a,e)=>a+(e.done||0),0)}}
function myDuels(){return Object.values(duel.duels).filter(d=>d.a===duel.me||d.b===duel.me)}
let scoreChain=Promise.resolve();
function scheduleScores(){if(!duel.db||!duel.me||!duel.ready)return;clearTimeout(duel.timer);duel.timer=setTimeout(writeScores,800)}
function writeScores(){
  const out={};myDuels().filter(d=>d.startAt).forEach(d=>{out[d.id]=duelScoresFor(d)});
  const j=JSON.stringify(out);const server=duel.scores[duel.me];
  if(duel.lastJson===null&&server){const sv={};Object.keys(server.duels||{}).forEach(k=>{const x=server.duels[k];sv[k]={workouts:x.workouts,minutes:x.minutes,exercises:x.exercises}});
    const ordered={};Object.keys(out).forEach(k=>{if(sv[k])ordered[k]=sv[k]});
    if(Object.keys(sv).length===Object.keys(out).length&&JSON.stringify(ordered)===j){duel.lastJson=j;return}}
  if(j===duel.lastJson)return;duel.lastJson=j;
  scoreChain=scoreChain.then(()=>duel.db.doc('scores/'+duel.me).set({duels:out,updatedAt:Date.now()})).catch(()=>{duel.lastJson=null});
}
function startDuels(db,id){duel.db=db;duel.me=id;
  db.collection('duels').onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{if(d.exists){const x=clone(d.data());x.id=d.id;m[d.id]=x}});
    duel.duels=m;duel.ready=true;if(view==='duel')renderDuels();scheduleScores()},()=>{});
  db.collection('scores').onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{if(d.exists)m[d.id]=clone(d.data())});
    duel.scores=m;if(view==='duel')renderDuels();scheduleScores()},()=>{});
  if(view==='duel'){renderDuels();renderDuelForm()}
}
setInterval(()=>{if(view==='duel'&&duel.db)renderDuels();scheduleScores()},60000);
function flash(t){const el=$('#duel-flash');el.textContent=t;el.hidden=false;clearTimeout(duel.flashT);duel.flashT=setTimeout(()=>{el.hidden=true},6000)}
function errText(e){const c=e&&e.code;if(c==='invalid_argument')return 'Не получилось сохранить: нужен доступ участника к приложению.';
  if(c==='quota_exceeded')return 'Хранилище приложения заполнено.';return 'Не получилось сохранить. Проверьте интернет и попробуйте ещё раз.'}
function leftText(ms){const h=Math.floor(ms/36e5),d=Math.floor(h/24);if(d>=1)return 'осталось '+d+' дн '+(h%24)+' ч';
  const m=Math.max(1,Math.floor(ms/6e4)%60);return h>0?'осталось '+h+' ч '+m+' мин':'осталось '+m+' мин'}
const dfmt=new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short'});
let duelSeq=0;
async function renderDuels(){
  const el=$('#duel-list');const seq=++duelSeq;
  if(!duel.db){el.innerHTML=`<div class="card empty"><h2>Дуэли пока недоступны</h2><p>${duel.blocked
    ?'У вас доступ только для просмотра. Попросите владельца приложения дать вам доступ участника.'
    :'Дуэли работают, когда приложение открыто в Claude под вашим аккаунтом. Если вы уже вошли, подождите пару секунд.'}</p></div>`;$('#duel-form').innerHTML='';return}
  if(!duel.ready){el.innerHTML='<p class="hint">Загружаю дуэли…</p>';return}
  const now=Date.now(),me=duel.me,all=Object.values(duel.duels);
  const mine=all.filter(d=>d.a===me||d.b===me);
  const active=mine.filter(d=>d.startAt&&now<d.endAt).sort((a,b)=>a.endAt-b.endAt);
  const waiting=mine.filter(d=>!d.b).sort((a,b)=>b.createdAt-a.createdAt);
  const incoming=all.filter(d=>!d.b&&d.a!==me&&(!d.invite||d.invite===me)).sort((a,b)=>b.createdAt-a.createdAt);
  const finished=mine.filter(d=>d.startAt&&now>=d.endAt).sort((a,b)=>b.endAt-a.endAt).slice(0,6);
  const ids=[...new Set(all.flatMap(d=>[d.a,d.b,d.invite]).filter(Boolean).concat(me))];
  let ps={};try{if(duel.user&&typeof duel.user.profiles==='function')ps=await duel.user.profiles(ids)}catch(e){}
  if(seq!==duelSeq)return;
  const nm=id=>id===me?'Вы':((ps[id]&&ps[id].name)||'Участник');
  const av=id=>ps[id]&&ps[id].avatarUrl?`<img class="av" src="${esc(ps[id].avatarUrl)}" alt="">`:'<span class="av"></span>';
  const terms=d=>`${METRICS[d.metric]?.label||''} · ${d.days} дн`;
  const stake=d=>d.stake?`<p class="stake">На кону: ${esc(d.stake)}</p>`:'';
  const card=(d,done)=>{const opp=d.a===me?d.b:d.a;const M=METRICS[d.metric]||METRICS.workouts;
    const mv=duelScoresFor(d)[d.metric]||0;const os=duel.scores[opp];const ov=(os&&os.duels&&os.duels[d.id]&&os.duels[d.id][d.metric])||0;
    const max=Math.max(mv,ov,1);const lead=mv>ov?'me':ov>mv?'opp':'tie';
    const badge=done?(lead==='me'?'<span class="badge win">Победа</span>':lead==='opp'?'<span class="badge lose">Поражение</span>':'<span class="badge tie">Ничья</span>')
      :(lead==='me'?'<span class="badge win">Вы ведёте</span>':lead==='opp'?'<span class="badge">Отстаёте</span>':'<span class="badge tie">Ровно</span>');
    const row=(id,v,isLead)=>`<div class="duel-row ${isLead?'lead':''}">${av(id)}<span class="who">${esc(nm(id))}</span><span class="val">${v}<small>${M.unit}</small></span><div class="dbar"><i style="width:${(v/max*100).toFixed(1)}%"></i></div></div>`;
    return `<article class="duel"><div class="duel-head"><h2>${esc(M.label)} · соперник: ${esc(nm(opp))}</h2>${badge}</div>
      <div class="duel-meta">${dfmt.format(d.startAt)} – ${dfmt.format(d.endAt)} · ${done?'завершена':leftText(d.endAt-now)}</div>
      ${row(me,mv,lead==='me')}${row(opp,ov,lead==='opp')}${stake(d)}
      ${done?`<div class="row"><button class="btn sm" data-act="rematch" data-id="${d.id}">Реванш</button></div>`:''}</article>`};
  let h='';
  if(incoming.length){h+='<h3 class="sect">Вас вызывают</h3>'+incoming.map(d=>`<article class="duel"><div class="duel-head"><h2>${esc(nm(d.a))} ${d.invite?'хочет реванш':'бросает вызов'}</h2><span class="badge">Вызов</span></div>
      <div class="duel-meta">${terms(d)}. ${METRICS[d.metric]?.hint||''}</div>${stake(d)}
      <div class="row"><button class="btn primary" data-act="accept" data-id="${d.id}">Принять вызов</button></div></article>`).join('')}
  if(active.length)h+='<h3 class="sect">Идут сейчас</h3>'+active.map(d=>card(d,false)).join('');
  if(waiting.length){h+='<h3 class="sect">Ждут соперника</h3>'+waiting.map(d=>`<article class="duel"><div class="duel-head"><h2>${d.invite?'Реванш для '+esc(nm(d.invite)):'Открытый вызов'}</h2><span class="badge wait">Ждём</span></div>
      <div class="duel-meta">${terms(d)}. Отсчёт начнётся, когда соперник примет вызов.</div>${stake(d)}
      <p class="hint">${d.invite?'Вызов увидит только этот человек, когда откроет приложение.':'Отправьте ссылку на приложение тому, с кем хотите соревноваться. Первый, кто примет вызов, станет вашим соперником.'}</p>
      <div class="row"><button class="btn sm ghost danger" data-act="cancel" data-id="${d.id}">Отменить вызов</button></div></article>`).join('')}
  if(finished.length)h+='<h3 class="sect">Завершённые</h3>'+finished.map(d=>card(d,true)).join('');
  if(!h)h=`<div class="card empty"><h2>Соревнуйтесь вдвоём</h2><p>Бросьте вызов ниже. Соперник откроет приложение у себя и примет его. Дальше каждый тренируется сам, а счёт обновляется у обоих сразу после тренировки.</p></div>`;
  el.innerHTML=h;
}

    <div class="fgroup"><span class="sect" style="margin:0">Что считаем</span><div class="seg" role="radiogroup" aria-label="Что считаем">${Object.entries(METRICS).map(([k,m])=>`<button role="radio" aria-checked="${f.metric===k}" data-act="metric" data-v="${k}">${m.label}</button>`).join('')}</div>

async function createDuel(src,invite){
  const id='d'+Date.now().toString(36)+uid();
  const body={id,a:duel.me,b:null,invite:invite||null,metric:src.metric,days:src.days,stake:String(src.stake||'').trim().slice(0,80),createdAt:Date.now(),startAt:null,endAt:null};
  try{await duel.db.doc('duels/'+id).set(body);
    if(!invite){duel.f.stake='';renderDuelForm()}
    flash(invite?'Реванш отправлен. Соперник увидит его, когда откроет приложение.':'Вызов создан. Отправьте ссылку на приложение сопернику.')}catch(e){flash(errText(e))}
}
async function acceptDuel(id){const ref=duel.db.doc('duels/'+id);
  try{const s=await ref.get();const d=s.exists?s.data():null;
    if(!d){flash('Этот вызов уже отменён.');return}if(d.b){flash('Этот вызов уже принял кто-то другой.');return}
    const now=Date.now();await ref.update({b:duel.me,startAt:now,endAt:now+d.days*DAY});
    flash('Дуэль началась. Тренировки с этой минуты идут в зачёт.')}catch(e){flash(errText(e))}}
async function cancelDuel(id){try{await duel.db.doc('duels/'+id).delete();flash('Вызов отменён.')}catch(e){flash(errText(e))}}
$('#v-duel').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||!duel.db)return;const a=b.dataset.act,id=b.dataset.id;
  if(a==='metric'){duel.f.metric=b.dataset.v;renderDuelForm()}
  else if(a==='days'){duel.f.days=+b.dataset.v;renderDuelForm()}
  else if(a==='create'){b.disabled=true;createDuel(duel.f).finally(()=>{b.disabled=false})}
  else if(a==='accept'){b.disabled=true;acceptDuel(id)}
  else if(a==='cancel'){if(b.dataset.sure){cancelDuel(id)}else{b.dataset.sure='1';b.textContent='Точно отменить?'}}
  else if(a==='rematch'){const d=duel.duels[id];if(d){b.disabled=true;createDuel(d,d.a===duel.me?d.b:d.a)}}
});

const BM={weight:{label:'Вес',unit:'кг',min:25,max:300},waist:{label:'Талия',unit:'см',min:30,max:250,hint:'по самой узкой части'},
  hips:{label:'Ягодицы',unit:'см',min:40,max:250,hint:'по самой выступающей точке'},thigh:{label:'Бедро',unit:'см',min:20,max:150,hint:'по самой широкой части, под ягодицей'}};
const nf=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:1});
const pad2=n=>String(n).padStart(2,'0');
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())};
const isoToDate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const dshort=new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short'});
const dlong=new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long',year:'numeric'});
const bstate={metric:'hips',edit:null,err:'',confirm:null};
function sortedBody(){return body.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0)}
function saveBody(){store.set('ct-body',body);cloud.write('body',{entries:body})}
function seriesOf(k){return sortedBody().filter(e=>typeof e[k]==='number').map(e=>({date:e.date,v:e[k]}))}
function fmtDelta(d){if(Math.abs(d)<0.05)return '±0';return (d>0?'+':'−')+nf.format(Math.abs(d))}
function renderBody(){
  const top=$('#body-top');const hist=$('#body-hist');
  const tiles=Object.entries(BM).map(([k,m])=>{const sr=seriesOf(k);const last=sr[sr.length-1];

function niceStep(range){const raw=range/4;const p=Math.pow(10,Math.floor(Math.log10(raw)));for(const m of [1,2,2.5,5,10])if(m*p>=raw)return m*p;return 10*p}
function drawChart(host,sr,m){
  const W=Math.max(280,host.clientWidth||520),H=210,L=44,R=16,T=14,B=28;
  const xs=sr.map(p=>isoToDate(p.date).getTime());const x0=xs[0],x1=xs[xs.length-1]===x0?x0+864e5:xs[xs.length-1];
  let lo=Math.min(...sr.map(p=>p.v)),hi=Math.max(...sr.map(p=>p.v));if(hi-lo<1){lo-=0.5;hi+=0.5}
  const st=niceStep(hi-lo);lo=Math.floor(lo/st)*st;hi=Math.ceil(hi/st)*st;
  const X=t=>L+(t-x0)/(x1-x0)*(W-L-R),Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  let g='';for(let v=lo;v<=hi+1e-9;v+=st){const y=Y(v).toFixed(1);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y}" dy="0.32em" text-anchor="end" fill="var(--muted)" font-size="11" font-family="var(--f-mono)">${nf.format(+v.toFixed(2))}</text>`}
  const lab=(i,anchor)=>`<text x="${X(xs[i]).toFixed(1)}" y="${H-8}" text-anchor="${anchor}" fill="var(--muted)" font-size="11">${dshort.format(new Date(xs[i]))}</text>`;
  const xl=lab(0,'start')+(sr.length>2&&W>360?lab(Math.floor((sr.length-1)/2),'middle'):'')+lab(sr.length-1,'end');
  const pts=sr.map((p,i)=>[X(xs[i]),Y(p.v)]);
  const line=`<polyline points="${pts.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  const area=`<path d="M${pts[0][0].toFixed(1)},${H-B} ${pts.map(q=>'L'+q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')} L${pts[pts.length-1][0].toFixed(1)},${H-B}Z" fill="var(--accent)" opacity=".08"/>`;
  const dots=pts.map((q,i)=>`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${i===pts.length-1?5:4}" fill="${i===pts.length-1?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="2"/>`).join('');
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${m.label}: ${sr.length} замеров, последний ${nf.format(sr[sr.length-1].v)} ${m.unit}">${g}${area}${line}
    <line id="bx" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>${dots}${xl}
    <rect x="${L}" y="0" width="${W-L-R}" height="${H}" fill="transparent" id="bhit"/></svg><div class="ctip" id="btip" hidden></div>`;
  const svg=host.querySelector('svg'),tip=host.querySelector('#btip'),vx=host.querySelector('#bx');
  const move=ev=>{const r=svg.getBoundingClientRect();const px=(ev.clientX-r.left)/r.width*W;let bi=0;pts.forEach((q,i)=>{if(Math.abs(q[0]-px)<Math.abs(pts[bi][0]-px))bi=i});
    const q=pts[bi];vx.setAttribute('x1',q[0]);vx.setAttribute('x2',q[0]);vx.setAttribute('visibility','visible');
    tip.hidden=false;tip.style.left=(q[0]/W*r.width)+'px';tip.style.top=(q[1]/H*r.height)+'px';
    tip.innerHTML=`${dshort.format(isoToDate(sr[bi].date))}<span>${nf.format(sr[bi].v)} ${m.unit}</span>`};
  const leave=()=>{tip.hidden=true;vx.setAttribute('visibility','hidden')};
  svg.addEventListener('pointermove',move);svg.addEventListener('pointerdown',move);svg.addEventListener('pointerleave',leave);
}

function saveBodyForm(){

/* ---------- working weights ---------- */
const exKey=n=>String(n||'').replace(/,?\s*(левая|правая|на каждую сторону)$/i,'').replace(/[«»]/g,'').trim();
const isWeighted=it=>!!it&&(!!it.reps&&/штанг|блин|гриф|тяга|жим|бицепс|шраг|пуловер|француз|разгибани|подъ[её]м блина|развед|вокруг головы|гоблет/i.test(it.name)||/штанг|блин|гриф|гантел/i.test(it.name||''));
const kg=v=>nf.format(v)+' кг';
function weightHistory(key){const out=[];log.forEach(e=>{if(e.weights&&typeof e.weights[key]==='number')out.push({at:e.at,v:e.weights[key]})});return out.sort((a,b)=>a.at-b.at)}
function lastWeight(key){const h=weightHistory(key);return h.length?h[h.length-1].v:null}
function parseKg(t){const v=Number(String(t).replace(',','.').replace(/\s/g,''));return isFinite(v)&&v>=0&&v<=500?Math.round(v*4)/4:null}
function setWeightCtl(item){
  const box=$('#r-wt');if(!R||!item||!isWeighted(item)){box.hidden=true;R&&(R.wKey=null);return}
  const key=exKey(item.name);if(R.wKey===key&&!box.hidden)return;R.wKey=key;box.hidden=false;{const st=/гантел/i.test(key)?'1 кг':'2,5 кг';$('#r-wminus').setAttribute('aria-label','Меньше на '+st);$('#r-wplus').setAttribute('aria-label','Больше на '+st)}
  const cur=R.weights[key];const inp=$('#r-wval');if(document.activeElement!==inp)inp.value=typeof cur==='number'?nf.format(cur):'';
  const h=weightHistory(key);
  $('#r-wprev').textContent=h.length?`В прошлый раз ${kg(h[h.length-1].v)}`+(h.length>1&&h[h.length-1].v>h[0].v?` · начинали с ${kg(h[0].v)}`:''):(/гантел/i.test(key)?'Впишите вес одной гантели':'Впишите вес грифа с блинами')+' — в следующий раз он подставится сам';
}
function bumpWeight(d){if(!R||!R.wKey)return;d=d*(/гантел/i.test(R.wKey)?1:2.5);const cur=typeof R.weights[R.wKey]==='number'?R.weights[R.wKey]:0;
  const v=Math.max(0,Math.round((cur+d)*4)/4);R.weights[R.wKey]=v;$('#r-wval').value=nf.format(v)}
$('#r-wminus').onclick=()=>bumpWeight(-1);
$('#r-wplus').onclick=()=>bumpWeight(1);
$('#r-wval').addEventListener('input',e=>{if(!R||!R.wKey)return;const t=e.target.value.trim();if(!t){delete R.weights[R.wKey];return}const v=parseKg(t);if(v!==null)R.weights[R.wKey]=v});
$('#r-wval').addEventListener('keydown',e=>{if(e.key==='Enter')e.target.blur()});

let R=null, soundOn=store.get('ct-sound',true), voiceOn=store.get('ct-voice',true), ac=null, wake=null;
function audio(){try{if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}}
  if(ac.state==='suspended')ac.resume();return ac}catch(e){return null}}
function tone(f,start,d,v=.28,type='sine'){const c=audio();if(!c)return;const t=c.currentTime+start;const o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.03)}
// start: three rising notes · stop: two falling notes · 3-2-1: short ticks · done: fanfare
const SFX={tick(){tone(880,0,.09,.22)},start(){[659,880,1175].forEach((f,i)=>tone(f,i*.12,.24,.32,'triangle'))},
  stop(){tone(1047,0,.2,.3,'square');tone(659,.22,.4,.28,'square')},done(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.15,i===3?.6:.28,.3,'triangle'))}};

try{if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}}catch(e){}

  const u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';if(ruVoice)u.voice=ruVoice;u.rate=1.05;speechSynthesis.speak(u)}catch(e){}},delay)}
function unlockAudio(){const c=audio();if(c){try{const b=c.createBuffer(1,1,22050),s=c.createBufferSource();s.buffer=b;s.connect(c.destination);s.start(0)}catch(e){}}
  try{if(voiceOn&&'speechSynthesis' in window){const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}}catch(e){}}
const spokenReps=r=>{const L=repsLabel(r);return L.replace(/–/g,' до ').replace(/≈/g,'около ')};
async function lockScreen(){try{wake=await navigator.wakeLock.request('screen')}catch(e){wake=null}}
function buildSteps(p){const s=[{type:'prep',name:'Приготовьтесь',dur:10,round:1}];
  for(let r=1;r<=p.rounds;r++){p.items.forEach((it,i)=>{s.push({type:'work',name:it.name,tip:it.tip,video:it.video,band:it.band,reps:repsOf(it),dur:it.work,round:r,idx:i});

function entryFrom(p,completedIdx,steps,weights,elapsed,full){

  })().catch(e=>{failSync(e)}).finally(()=>{sb.pulling=null});

function signedOut(expired){
  const had=!!sb.me;sb.me=null;sb.name='';setSession(null);
  Object.values(sb.timers).forEach(clearTimeout);

  if(had||expired){programs=SAMPLES.map(cloneP);log=[];body=[];store.set('ct-programs',programs);store.set('ct-log',log);store.set('ct-body',body);
    try{localStorage.removeItem(OWNER_KEY);localStorage.removeItem(DIRTY_KEY);localStorage.removeItem('ct-active')}catch(e){}}

function errRu(e){const m=String(e&&e.message||'').toLowerCase(),c=String(e&&e.code||'');
  if(!e||e.status===undefined&&/fetch|network|load failed/.test(m))return 'Нет связи с интернетом. Проверьте подключение и попробуйте ещё раз.';
  if(c==='invalid_credentials'||/invalid login credentials/.test(m))return 'Неверная почта или пароль.';
  if(c==='email_not_confirmed'||/email not confirmed/.test(m))return 'Почта ещё не подтверждена. Откройте письмо от Supabase и нажмите ссылку подтверждения, затем войдите снова.';
  if(c==='user_already_exists'||/already registered|already been registered/.test(m))return 'Такая почта уже зарегистрирована. Войдите или восстановите пароль.';
  if(c==='weak_password'||/password should be|weak password/.test(m))return 'Пароль слишком простой: нужно не меньше 6 символов.';
  if(c==='over_email_send_rate_limit'||e.status===429||/rate limit/.test(m))return 'Слишком много писем за короткое время. Подождите около часа и попробуйте снова.';
  if(c==='validation_failed'||/invalid.*email|email.*invalid/.test(m))return 'Проверьте адрес почты.';
  if(c==='signup_disabled')return 'Регистрация сейчас закрыта.';
  if(c==='same_password')return 'Новый пароль совпадает со старым.';
  return 'Не получилось: '+(e&&e.message||'неизвестная ошибка')+'. Попробуйте ещё раз.'}

async function submitAccount(){

      sb.mode='account';sb.msg='Пароль изменён. Теперь им можно входить на всех устройствах.';sb.msgKind='ok';await afterSignIn()}

      else if(j&&j.user&&Array.isArray(j.user.identities)&&j.user.identities.length===0){sb.msg='Такая почта уже зарегистрирована. Войдите или восстановите пароль.';sb.msgKind='err';sb.mode='signin'}
      else{sb.mode='signin';sb.msg=`Почти готово! Мы отправили письмо на ${email}. Откройте его и нажмите ссылку подтверждения (можно на любом устройстве), затем войдите здесь с паролем. Письмо может прийти в «Спам».`;sb.msgKind='ok'}}
    else if(sb.mode==='forgot'){await sbAuth('recover',{email:v('a-email')});sb.mode='signin';sb.msg='Письмо отправлено. Откройте ссылку из него, задайте новый пароль и войдите.';sb.msgKind='ok'}

renderDuels=function(){

};
renderDuelForm=function(){
  const el=$('#duel-form');if(!sb.me){el.innerHTML='';return}const f=sbd.f;
  el.innerHTML=`<div class="card"><h2>Новая дуэль</h2>
    <div class="fgroup"><span class="sect" style="margin:0">Что считаем</span><div class="seg" role="radiogroup" aria-label="Что считаем">${Object.entries(METRICS).map(([k,m])=>`<button role="radio" type="button" aria-checked="${f.metric===k}" data-sb="metric" data-v="${k}">${m.label}</button>`).join('')}</div>
    <p class="hint">${METRICS[f.metric].hint}</p></div>
    <div class="fgroup"><span class="sect" style="margin:0">Сколько длится</span><div class="seg" role="radiogroup" aria-label="Длительность">${[3,7,14].map(n=>`<button role="radio" type="button" aria-checked="${f.days===n}" data-sb="days" data-v="${n}">${n} дней</button>`).join('')}</div></div>
    <label class="f">На кону, по желанию<input id="sbd-stake" maxlength="80" value="${esc(f.stake)}" placeholder="Например, кофе"></label>
    <div class="row"><button class="btn primary" data-sb="create" type="button">Создать вызов и получить код</button></div></div>`;
  $('#sbd-stake').oninput=e=>{f.stake=e.target.value};
};
async function peekCode(raw){const code=String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');sbd.code=code;sbd.peek=null;
  if(code.length<6){flash('Код состоит из 6 символов — проверьте его.');renderDuels();return}
  try{const j=await rest('rpc/peek_duel',{method:'POST',body:{code}});sbd.peek={...j,id:j.id};renderDuels()}
  catch(e){flash(e.status===401?'Войдите, чтобы принять вызов.':/duel_unavailable/.test(e.message)?'Вызов не найден: код неверный, вызов отменён или его уже кто-то принял.':errRu(e));renderDuels()}}
async function createSbDuel(src,invite){
  for(let i=0;i<4;i++){const id=newCode();
    try{await rest('duels',{method:'POST',body:{id,a:sb.me,invite:invite||null,metric:src.metric,days:src.days,stake:String(src.stake||'').trim().slice(0,80),created_at:Date.now()},prefer:'return=minimal'});
      if(!invite){sbd.f.stake='';renderDuelForm()}
      flash(invite?'Реванш отправлен: соперник увидит его на вкладке «Дуэли».':'Вызов создан. Отправьте код сопернику.');await loadDuels();return}
    catch(e){if(e.status===409||e.code==='23505')continue;flash(errRu(e));return}}
  flash('Не получилось создать код. Попробуйте ещё раз.')}
async function shareCode(id){const text=`Вызываю тебя на дуэль в «Круговом тренере»! Код: ${id}\nОткрой приложение, вкладка «Дуэли» → «Принять вызов по коду»: ${shareUrl()}`;
  if(navigator.share){try{await navigator.share({title:'Вызов на дуэль',text});return}catch(e){if(e&&e.name==='AbortError')return}}
  copyCode(id,text)}
async function copyCode(id,text){try{await navigator.clipboard.writeText(text||id);flash(text?'Сообщение с кодом скопировано — вставьте его в мессенджер.':'Код скопирован.')}catch(e){flash('Код: '+id+' — перепишите его сопернику.')}}
$('#v-duel').addEventListener('click',async e=>{const b=e.target.closest('[data-sb]');if(!b)return;const a=b.dataset.sb,id=b.dataset.id;
  if(a==='metric'){sbd.f.metric=b.dataset.v;renderDuelForm()}
  else if(a==='days'){sbd.f.days=+b.dataset.v;renderDuelForm()}
  else if(a==='create'){b.disabled=true;await createSbDuel(sbd.f);b.disabled=false}
  else if(a==='share')shareCode(id);
  else if(a==='copy')copyCode(id);
  else if(a==='peek-x'){sbd.peek=null;sbd.code='';renderDuels()}
  else if(a==='accept'){b.disabled=true;try{await rest('rpc/accept_duel',{method:'POST',body:{duel_id:id}});sbd.peek=null;sbd.code='';flash('Дуэль началась! Тренировки с этой минуты идут в зачёт.');await loadDuels()}
    catch(e2){flash(/duel_unavailable/.test(e2.message)?'Этот вызов уже недоступен: его отменили или приняли.':errRu(e2));b.disabled=false}}
  else if(a==='cancel'){if(!b.dataset.sure){b.dataset.sure='1';b.textContent='Точно отменить?';return}
    try{await rest('duels?id=eq.'+encodeURIComponent(id),{method:'DELETE',prefer:'return=minimal'});flash('Вызов отменён.');await loadDuels()}catch(e2){flash(errRu(e2))}}
  else if(a==='rematch'){const d=sbd.duels.find(x=>x.id===id);if(d){b.disabled=true;await createSbDuel(d,d.a===sb.me?d.b:d.a)}}
});

/* ---------- start-up ---------- */
setInterval(()=>{if(sb.me&&document.visibilityState==='visible'&&view==='duel')loadDuels()},30000);
setInterval(()=>{if(sb.me&&document.visibilityState==='visible')pull()},120000);
document.addEventListener('visibilitychange',()=>{if(sb.me&&document.visibilityState==='visible')pull()});
addEventListener('online',()=>{if(sb.me)pull()});
(async function sbInit(){
  const h=new URLSearchParams(location.hash.replace(/^#/,''));
  if(h.get('error_description')||h.get('error')){sb.msg='Ссылка из письма не сработала: '+(h.get('error_description')||h.get('error'))+'. Возможно, она устарела — запросите новую.';sb.msgKind='err';history.replaceState(null,'',location.pathname+location.search);openAccount()}
  else if(h.get('access_token')){const type=h.get('type');history.replaceState(null,'',location.pathname+location.search);
    setSession({access_token:h.get('access_token'),refresh_token:h.get('refresh_token'),expires_in:+h.get('expires_in')||3600,expires_at:+h.get('expires_at')||undefined});
    try{const u=await sbAuth('user',null,{method:'GET',auth:true});sb.session.user={id:u.id,email:u.email,name:(u.user_metadata&&u.user_metadata.name)||''};store.set(SESSION_KEY,sb.session)}
    catch(e){setSession(null);sb.msg='Ссылка из письма устарела. Войдите с паролем или запросите новую ссылку.';sb.msgKind='err';openAccount()}
    if(sb.session){if(type==='recovery'){sb.mode='recovery';sb.msg='';await afterSignIn();sb.mode='recovery';openAccount()}
      else{await afterSignIn();if(sb.mode!=='name'){sb.mode='account';sb.msg='Почта подтверждена, вы вошли. Теперь войдите с этим же паролем и в приложении на экране «Домой».';sb.msgKind='ok';openAccount()}}}}
  if(!sb.me){if(sb.session){await afterSignIn()}else setSync('sbout')}
})();
</script>
</body>
