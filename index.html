<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Круговой тренер</title>
<meta name="description" content="Интервальный таймер, программы со своим весом, журнал тренировок и замеры тела">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Тренер">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11161c" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,sans-serif;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: one narrow column like a phone app, tabs at top, full-bleed runner screen when a workout is on */
:root{
  --bg:#eef1f4; --surface:#ffffff; --line:#d5dbe2; --fg:#16202b; --muted:#5d6b7a;
  --accent:#2742d6; --accent-ink:#ffffff;
  --work:#e2462b; --rest:#0f9a86; --track:#dde3ea; --far:#a7b2bf;
  --f-display:"Unbounded",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161c; --surface:#1a222b; --line:#2b3540; --fg:#e8edf2; --muted:#93a1b0;
  --accent:#7d93ff; --accent-ink:#0d1220; --work:#ff6a4d; --rest:#2fc9b2; --track:#26303b; --far:#4d5b6b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#1a222b; --line:#2b3540; --fg:#e8edf2; --muted:#93a1b0;
  --accent:#7d93ff; --accent-ink:#0d1220; --work:#ff6a4d; --rest:#2fc9b2; --track:#26303b; --far:#4d5b6b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);margin:0}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1{font:800 26px/1.1 var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font:700 15px/1.2 var(--f-display);margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;min-width:0;border:0;background:none;color:var(--muted);font:600 14px var(--f-body);padding:9px 4px;border-radius:9px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){.tabs{overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{flex:0 0 auto;padding:9px 12px;font-size:13.5px}}
/* body tracking */
.bm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:520px){.bm-grid{grid-template-columns:1fr 1fr}}
.bm{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;color:var(--fg);font:inherit;display:flex;flex-direction:column;gap:2px;min-width:0}
.bm[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.bm .l{font-size:12px;color:var(--muted);font-weight:600}
.bm b{font:700 21px/1.15 var(--f-mono);font-variant-numeric:tabular-nums}
.bm b small{font:500 12px var(--f-body);color:var(--muted);margin-left:3px}
.bm .dl{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chartwrap{position:relative;min-width:0}
.chartwrap svg{display:block;width:100%;height:auto;overflow:visible}
.ctip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font:600 12px var(--f-body);padding:5px 8px;border-radius:7px;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px))}
.ctip span{font:700 13px var(--f-mono);margin-left:4px}
.bform{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.bform .full{grid-column:1/-1}
.bentry{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.bentry:last-child{border-bottom:0}
.bentry .vals{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 14px;font:500 13px var(--f-mono);color:var(--fg);font-variant-numeric:tabular-nums}
.bentry .vals span{color:var(--muted);font-family:var(--f-body);font-size:12px;margin-right:4px}
.bentry .nt{grid-column:1/-1;font-size:13px;color:var(--muted)}
.err{color:var(--work);font-size:13px;margin:0}
/* duels */
.duel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.duel-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.duel-meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.duel-row{display:grid;grid-template-columns:34px 1fr auto;gap:4px 10px;align-items:center}
.duel-row .who{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.duel-row .val{font:700 24px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.duel-row .val small{font:500 12px var(--f-body);color:var(--muted);margin-left:3px}
.duel-row .dbar{grid-column:2/-1;height:8px;background:var(--track);border-radius:4px;overflow:hidden}
.dbar i{display:block;height:100%;background:var(--far);border-radius:4px;min-width:4px}
.duel-row.lead .dbar i{background:var(--rest)}
.av{width:34px;height:34px;border-radius:50%;background:var(--track);grid-row:span 2;object-fit:cover;display:block}
.badge{font:700 11px var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:99px;color:#fff;background:var(--work);white-space:nowrap}
.badge.win{background:var(--rest)} .badge.lose,.badge.wait{background:var(--muted)} .badge.tie{background:var(--accent);color:var(--accent-ink)}
.stake{font-size:13px;background:var(--bg);border-radius:8px;padding:7px 10px;margin:0}
.sect{font:700 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 0 -2px}
.seg{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1;min-width:0;border:0;background:none;padding:8px 4px;border-radius:7px;font:600 13px var(--f-body);color:var(--muted);cursor:pointer}
.seg button[aria-checked="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.fgroup{display:flex;flex-direction:column;gap:8px}
.fgroup .hint{margin:0}
.flash{background:var(--surface);border:1px solid var(--rest);border-radius:12px;padding:10px 14px;font-size:14px;margin:0}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.list{display:flex;flex-direction:column;gap:10px}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:10px 12px;align-items:center}
.prog .meta{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.strip{grid-column:1/-1;display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x proximity;min-width:0}
.tile{flex:0 0 96px;margin:0;display:flex;flex-direction:column;gap:5px;scroll-snap-align:start}
.tile svg{display:block;width:96px;height:72px;background:var(--bg);border:1px solid var(--line);border-radius:9px}
.tile figcaption{font-size:11.5px;line-height:1.25;color:var(--fg)}
.tile figcaption span{display:block;color:var(--muted);font:600 11px var(--f-mono);margin-top:2px}
.vlink{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font:600 12px var(--f-body);text-decoration:none;margin-top:4px}
.vlink svg{width:12px;height:12px;fill:currentColor}
.vlink:hover{text-decoration:underline}
.vbtn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--accent);border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 16px;font:600 14px var(--f-body)}
.vbtn svg{width:16px;height:16px;fill:currentColor}
.ex .vurl{grid-column:2/-1;font-size:13px;padding:7px 10px}
.ex + .ex{border-top:1px solid var(--line);padding-top:10px}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 14px var(--f-body);padding:9px 14px;border-radius:10px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.danger{color:var(--work)}
.btn.sm{padding:6px 10px;font-size:13px}
.play{width:48px;height:48px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;display:grid;place-items:center}
.play svg{width:20px;height:20px;fill:currentColor}
.prog-actions{grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end;border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
/* editor */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em;text-transform:uppercase}
input{font:500 15px var(--f-body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;min-width:0}
input[type=number]{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ex{display:grid;grid-template-columns:56px 1fr 76px 34px;gap:6px 8px;align-items:center}
.ex .th{grid-row:span 2;align-self:start}
.ex .th svg{display:block;width:56px;height:42px;background:var(--bg);border:1px solid var(--line);border-radius:8px}
.icon{width:34px;height:34px;border:1px solid var(--line);background:none;border-radius:8px;color:var(--muted);cursor:pointer;font-size:16px}
.hint{font-size:13px;color:var(--muted);margin:0}
/* log */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font:700 24px var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.day i{width:100%;aspect-ratio:1;max-width:100%;border-radius:8px;background:var(--track);display:block}
.day i.on{background:var(--rest)}
.day.today span{color:var(--fg);font-weight:700}
.entry{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.entry small{color:var(--muted);font-variant-numeric:tabular-nums}
.entry .t{font:600 14px var(--f-mono);text-align:right}
.empty{text-align:center;color:var(--muted);padding:28px 12px}
.empty h2{color:var(--fg);margin-bottom:6px}
.note{font-size:12px;color:var(--muted);margin:0}
.sync{display:flex;align-items:flex-start;gap:7px;font-size:12.5px;color:var(--muted);margin:8px 0 0}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--far);flex:none;margin-top:.45em}
.sync[data-s="cloud"] i{background:var(--rest)}
.sync[data-s="error"] i,.sync[data-s="full"] i{background:var(--work)}
/* runner */
#runner{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;align-items:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));gap:12px;overflow-y:auto}
#runner .top{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;gap:10px}
#runner .prog-name{font:700 14px var(--f-display);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.phase{font:800 13px var(--f-display);letter-spacing:.14em;text-transform:uppercase;padding:6px 14px;border-radius:99px;color:#fff}
.phase.work{background:var(--work)} .phase.rest{background:var(--rest)} .phase.prep{background:var(--muted)} .phase.done{background:var(--accent)}
.stage{display:flex;align-items:center;justify-content:center;gap:clamp(10px,4vw,36px);width:100%;max-width:760px}
.ring{position:relative;flex:0 0 auto;width:min(40vw,34vh,300px);aspect-ratio:1;max-width:100%}
.figbox{flex:0 1 auto;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.figbox svg{display:block;width:min(50vw,46vh,400px);aspect-ratio:4/3;height:auto;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.target{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;min-height:1.4em}
.target i{width:9px;height:9px;border-radius:50%;background:var(--work);display:inline-block}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14%}
.clock{font:700 min(11vw,9vh,84px)/1 var(--f-mono);font-variant-numeric:tabular-nums}
.exname{font:700 clamp(18px,5vw,26px)/1.2 var(--f-display);margin:0;text-align:center;max-width:24ch;text-wrap:balance;min-height:1.2em}
.tip{font-size:15px;line-height:1.4;color:var(--muted);margin:0;max-width:40ch;text-align:center;min-height:2.8em}
.tag{font:600 11px var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:var(--rest);border:1px solid currentColor;border-radius:99px;padding:2px 8px;vertical-align:3px;white-space:nowrap}
.next{color:var(--muted);font-size:14px;text-align:center}
.next b{color:var(--fg)}
.counters{display:flex;gap:18px;font:600 13px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.bar{width:100%;max-width:520px;height:6px;background:var(--track);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.controls{display:flex;gap:14px;align-items:center;margin-top:4px}
.controls .big{width:76px;height:76px}
.controls .big svg{width:30px;height:30px}
.circ{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:grid;place-items:center}
.circ svg{width:20px;height:20px;fill:currentColor}
.sound{font-size:13px}
@media (prefers-reduced-motion:no-preference){.ring circle.p{transition:stroke-dashoffset .25s linear}}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}.grid3 .f:first-child{grid-column:1/-1}}
</style>
</head>
<body>

<div class="wrap" id="app">
  <header>
    <h1>Круговой тренер</h1>
    <p class="sub">Интервальный таймер, свои программы и журнал тренировок</p>
    <p class="sync" id="sync" data-s="local" aria-live="polite"><i></i><span>Сохраняется на этом устройстве</span></p>
  </header>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-programs" aria-selected="true" data-view="programs">Программы</button>
    <button role="tab" id="tab-edit" aria-selected="false" data-view="edit">Конструктор</button>
    <button role="tab" id="tab-log" aria-selected="false" data-view="log">Журнал</button>
    <button role="tab" id="tab-body" aria-selected="false" data-view="body">Тело</button>
  </div>
  <section id="v-programs" class="list"></section>
  <section id="v-edit" hidden></section>
  <section id="v-log" hidden></section>
  <section id="v-duel" class="list" hidden><p class="flash" id="duel-flash" hidden></p><div class="list" id="duel-list"></div><div id="duel-form"></div></section>
  <section id="v-body" class="list" hidden><div class="list" id="body-top"></div><div id="body-form"></div><div id="body-hist"></div></section>
</div>

<div id="runner" hidden>
  <div class="top">
    <span class="prog-name" id="r-name"></span>
    <button class="btn sm ghost sound" id="r-sound">Звук: вкл</button>
  </div>
  <span class="phase prep" id="r-phase">Приготовьтесь</span>
  <h2 class="exname" id="r-ex"></h2>
  <div class="stage">
  <div class="ring">
    <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="var(--track)" stroke-width="8"/>
      <circle class="p" id="r-arc" cx="60" cy="60" r="54" fill="none" stroke="var(--muted)" stroke-width="8" stroke-linecap="round" stroke-dasharray="339.29" stroke-dashoffset="0"/></svg>
    <div class="center"><div class="clock" id="r-clock">0:10</div></div>
  </div>
  <div class="figbox"><div id="r-fig"></div><div class="target" id="r-target"></div></div>
  </div>
  <p class="tip" id="r-tip"></p>
  <a class="vbtn" id="r-video" target="_blank" rel="noopener" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg><span>Видео: как делать правильно</span></a>
  <div class="counters"><span id="r-round"></span><span id="r-step"></span><span id="r-left"></span></div>
  <div class="bar"><i id="r-bar"></i></div>
  <div class="next" id="r-next"></div>
  <div class="controls">
    <button class="circ" id="r-stop" aria-label="Завершить"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
    <button class="play big" id="r-toggle" aria-label="Пауза"></button>
    <button class="circ" id="r-skip" aria-label="Пропустить"><svg viewBox="0 0 24 24"><path d="M5 5l9 7-9 7zM16 5h3v14h-3z"/></svg></button>
  </div>
</div>

<script>
const ICON_PLAY='<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>';
const ICON_PAUSE='<svg viewBox="0 0 24 24"><rect x="6" y="4.5" width="4.5" height="15" rx="1"/><rect x="13.5" y="4.5" width="4.5" height="15" rx="1"/></svg>';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const uid=()=>Math.random().toString(36).slice(2,9);

const SAMPLES=[
 {id:'g1',name:'Ягодицы: база',rounds:3,rest:15,restRound:60,tag:'Свой вес',items:[
  {name:'Ягодичный мостик',work:45,tip:'Пятки ближе к тазу, вверху сожмите ягодицы на 1–2 секунды, поясницу не прогибайте'},
  {name:'Приседания сумо',work:45,tip:'Стопы шире плеч, носки врозь, колени смотрят туда же, куда носки'},
  {name:'Отведение ноги назад на четвереньках, левая',work:30,tip:'Колено согнуто под 90°, толкайте пятку в потолок, спина ровная'},
  {name:'Отведение ноги назад на четвереньках, правая',work:30,tip:'Колено согнуто под 90°, толкайте пятку в потолок, спина ровная'},

function setSync(st){const el=$('#sync');if(!el)return;el.dataset.s=st;el.querySelector('span').textContent=SYNC_TEXT[st]}
const monthKey=t=>{const d=new Date(t);return 'log-'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const clone=o=>JSON.parse(JSON.stringify(o));
const cloud={col:null,uid:null,docs:{},chains:{},merged:false,
  write(id,data){if(!this.col)return;const body=clone(data);
    const run=()=>this.col?this.col.doc(id).set(body).then(()=>{if(this.merged)setSync('cloud')}).catch(e=>{const c=e&&e.code;
      if(c==='invalid_argument'){this.col=null;setSync('noaccess')}
      else if(c==='not_granted'||c==='revoked'||c==='capability_disabled'||c==='capability_removed'){this.col=null;setSync('local')}
      else if(c==='quota_exceeded')setSync('full');else setSync('error')}):null;
    this.chains[id]=(this.chains[id]||Promise.resolve()).then(run,run)},
  writePrograms(){this.write('programs',{items:programs,seeded:SAMPLES.map(p=>p.id),updatedAt:Date.now()})},
  addEntry(e){if(!this.col)return;const k=monthKey(e.at);const entries=[...((this.docs[k]&&this.docs[k].entries)||[]).filter(x=>x.at!==e.at),e];
    this.docs[k]={entries};this.write(k,{entries})}
};
function mergeLocal(docs){
  const flag='ct-merged-'+cloud.uid;if(store.get(flag,false))return;
  if(!docs.programs){docs.programs={items:clone(programs)};cloud.writePrograms()}
  else{const remote=docs.programs.items||[];const sampleIds=SAMPLES.map(p=>p.id);
    const extra=programs.filter(p=>!sampleIds.includes(p.id)&&!remote.some(x=>x.id===p.id));
    if(extra.length){docs.programs={items:[...remote,...clone(extra)]};programs=docs.programs.items;cloud.writePrograms()}}
  const byMonth={};log.forEach(e=>{(byMonth[monthKey(e.at)]=byMonth[monthKey(e.at)]||[]).push(e)});
  for(const k in byMonth){const remote=(docs[k]&&docs[k].entries)||[];const add=byMonth[k].filter(e=>!remote.some(x=>x.at===e.at));
    if(add.length){docs[k]={entries:[...remote,...add].sort((a,b)=>a.at-b.at)};cloud.docs[k]=docs[k];cloud.write(k,docs[k])}}
  store.set(flag,true);
}
function onCloud(snap){
  if(!cloud.merged&&snap.metadata.fromCache)return;
  const docs={};snap.docs.forEach(d=>{if(d.exists)docs[d.id]=clone(d.data())});
  cloud.docs=docs;
  if(!cloud.merged){mergeLocal(docs);cloud.merged=true;setSync('cloud')}
  if(docs.programs&&Array.isArray(docs.programs.items)){
    const seeded=Array.isArray(docs.programs.seeded)?docs.programs.seeded:['g1','g2','s1','s2','s3'];
    const add=SAMPLES.filter(sp=>!seeded.includes(sp.id)&&!docs.programs.items.some(p=>p.id===sp.id));
    programs=docs.programs.items;
    if(add.length||!Array.isArray(docs.programs.seeded)){
      const firstOld=programs.findIndex(p=>p.id==='s1');const at=firstOld<0?programs.length:firstOld;
      programs=[...programs.slice(0,at),...add.map(cloneP),...programs.slice(at)];docs.programs.items=programs;
      if(!cloud.seedWritten){cloud.seedWritten=true;cloud.writePrograms()}}
  }
  if(docs.body&&Array.isArray(docs.body.entries)){body=docs.body.entries;store.set('ct-body',body)}
  else if(body.length&&!cloud.bodyPushed){cloud.bodyPushed=true;cloud.write('body',{entries:body})}
  log=Object.keys(docs).filter(k=>k.startsWith('log-')).flatMap(k=>docs[k].entries||[]).sort((a,b)=>a.at-b.at);
  store.set('ct-programs',programs);store.set('ct-log',log);
  if(view==='programs')renderPrograms();if(view==='log')renderLog();if(view==='duel')renderDuels();if(view==='body')renderBody();
  scheduleScores();
}
async function initCloud(){
  if(!window.claude||typeof window.claude.use!=='function'){setSync('local');return}
  setSync('connecting');
  try{const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    const id=user?await user.id():null;
    if(!db||!id){setSync('local');return}
    let canWrite=null;try{canWrite=typeof user.can==='function'?await user.can('data.write'):null}catch(e){}
    duel.user=user;
    if(canWrite===false){duel.blocked=true;setSync('noaccess');return}
    cloud.uid=id;cloud.col=db.collection('data/users/'+id);
    cloud.col.onSnapshot(onCloud,e=>{setSync(e&&e.code==='revoked'?'local':'error')});
    startDuels(db,id);
  }catch(e){setSync('local')}
}

function niceStep(range){const raw=range/4;const p=Math.pow(10,Math.floor(Math.log10(raw)));for(const m of [1,2,2.5,5,10])if(m*p>=raw)return m*p;return 10*p}
function drawChart(host,sr,m){
  const W=Math.max(280,host.clientWidth||520),H=210,L=44,R=16,T=14,B=28;
  const xs=sr.map(p=>isoToDate(p.date).getTime());const x0=xs[0],x1=xs[xs.length-1]===x0?x0+864e5:xs[xs.length-1];
  let lo=Math.min(...sr.map(p=>p.v)),hi=Math.max(...sr.map(p=>p.v));if(hi-lo<1){lo-=0.5;hi+=0.5}
  const st=niceStep(hi-lo);lo=Math.floor(lo/st)*st;hi=Math.ceil(hi/st)*st;
  const X=t=>L+(t-x0)/(x1-x0)*(W-L-R),Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  let g='';for(let v=lo;v<=hi+1e-9;v+=st){const y=Y(v).toFixed(1);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y}" dy="0.32em" text-anchor="end" fill="var(--muted)" font-size="11" font-family="var(--f-mono)">${nf.format(+v.toFixed(2))}</text>`}
  const lab=(i,anchor)=>`<text x="${X(xs[i]).toFixed(1)}" y="${H-8}" text-anchor="${anchor}" fill="var(--muted)" font-size="11">${dshort.format(new Date(xs[i]))}</text>`;
  const xl=lab(0,'start')+(sr.length>2&&W>360?lab(Math.floor((sr.length-1)/2),'middle'):'')+lab(sr.length-1,'end');
  const pts=sr.map((p,i)=>[X(xs[i]),Y(p.v)]);
  const line=`<polyline points="${pts.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  const area=`<path d="M${pts[0][0].toFixed(1)},${H-B} ${pts.map(q=>'L'+q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')} L${pts[pts.length-1][0].toFixed(1)},${H-B}Z" fill="var(--accent)" opacity=".08"/>`;
  const dots=pts.map((q,i)=>`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${i===pts.length-1?5:4}" fill="${i===pts.length-1?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="2"/>`).join('');
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${m.label}: ${sr.length} замеров, последний ${nf.format(sr[sr.length-1].v)} ${m.unit}">${g}${area}${line}
    <line id="bx" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>${dots}${xl}
    <rect x="${L}" y="0" width="${W-L-R}" height="${H}" fill="transparent" id="bhit"/></svg><div class="ctip" id="btip" hidden></div>`;
  const svg=host.querySelector('svg'),tip=host.querySelector('#btip'),vx=host.querySelector('#bx');
  const move=ev=>{const r=svg.getBoundingClientRect();const px=(ev.clientX-r.left)/r.width*W;let bi=0;pts.forEach((q,i)=>{if(Math.abs(q[0]-px)<Math.abs(pts[bi][0]-px))bi=i});
    const q=pts[bi];vx.setAttribute('x1',q[0]);vx.setAttribute('x2',q[0]);vx.setAttribute('visibility','visible');
    tip.hidden=false;tip.style.left=(q[0]/W*r.width)+'px';tip.style.top=(q[1]/H*r.height)+'px';
    tip.innerHTML=`${dshort.format(isoToDate(sr[bi].date))}<span>${nf.format(sr[bi].v)} ${m.unit}</span>`};
  const leave=()=>{tip.hidden=true;vx.setAttribute('visibility','hidden')};
  svg.addEventListener('pointermove',move);svg.addEventListener('pointerdown',move);svg.addEventListener('pointerleave',leave);
}

function dayKey(t){const d=new Date(t);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()}

  let streak=0;const c=new Date(start);if(!days.has(dayKey(c)))c.setDate(c.getDate()-1);

/* ---------- runner ---------- */
let R=null, soundOn=store.get('ct-sound',true), ac=null, wake=null;
function beep(f=880,d=.12,v=.25){if(!soundOn)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(v,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
async function lockScreen(){try{wake=await navigator.wakeLock.request('screen')}catch(e){wake=null}}
function buildSteps(p){const s=[{type:'prep',name:'Приготовьтесь',dur:10,round:1}];
  for(let r=1;r<=p.rounds;r++){p.items.forEach((it,i)=>{s.push({type:'work',name:it.name,tip:it.tip,video:it.video,dur:it.work,round:r,idx:i});
    const last=i===p.items.length-1;
    if(!last&&p.rest>0)s.push({type:'rest',name:'Отдых',dur:p.rest,round:r});
    if(last&&r<p.rounds&&p.restRound>0)s.push({type:'rest',name:'Отдых между кругами',dur:p.restRound,round:r})})}
  return s}
function startRun(p){
  R={p,steps:buildSteps(p),i:0,left:10,paused:false,last:performance.now(),startAt:Date.now(),workSec:0,done:0,timer:null,lastBeep:null};
  $('#runner').hidden=false;$('#r-name').textContent=p.name;
  $('#r-sound').textContent='Звук: '+(soundOn?'вкл':'выкл');
  beep(660,.08,.15);lockScreen();
  R.left=R.steps[0].dur;R.timer=setInterval(tick,100);anim.name=null;paint();cancelAnimationFrame(anim.raf);anim.last=0;anim.raf=requestAnimationFrame(animLoop);
}
function tick(){if(!R||R.paused){if(R)R.last=performance.now();return}
  const now=performance.now(),dt=(now-R.last)/1000;R.last=now;R.left-=dt;
  if(R.steps[R.i].type==='work')R.workSec+=dt;
  const s=Math.ceil(R.left);
  if(s<=3&&s>0&&R.lastBeep!==s){R.lastBeep=s;beep(700,.1,.2)}
  if(R.left<=0)next(); else paint()}
function next(){const cur=R.steps[R.i];if(cur.type==='work')R.done++;
  R.i++;R.lastBeep=null;
  if(R.i>=R.steps.length){finish(true);return}
  R.left=R.steps[R.i].dur;beep(R.steps[R.i].type==='work'?1040:520,.25,.3);paint()}
function finish(full){clearInterval(R.timer);
  const sec=Math.round((Date.now()-R.startAt)/1000);
  if(R.done>0||full){const entry={name:R.p.name,at:Date.now(),sec,done:R.done,full};log.push(entry);store.set('ct-log',log);cloud.addEntry(entry)}
  if(full){beep(880,.15);setTimeout(()=>beep(1175,.3),180);
    $('#r-phase').className='phase done';$('#r-phase').textContent='Готово';
    $('#r-clock').textContent=mmss(sec);$('#r-ex').textContent='Тренировка записана в журнал';
    $('#r-next').innerHTML='';$('#r-tip').textContent='';$('#r-video').hidden=true;$('#r-arc').style.strokeDashoffset=0;$('#r-arc').setAttribute('stroke','var(--accent)');
    $('#r-bar').style.width='100%';$('#r-round').textContent='';$('#r-step').textContent=R.done+' упражнений';$('#r-left').textContent='';
    $('#r-toggle').hidden=true;$('#r-skip').hidden=true;$('#r-stop').setAttribute('aria-label','Закрыть');R.finished=true;return}
  closeRunner()}
function closeRunner(){if(R)clearInterval(R.timer);cancelAnimationFrame(anim.raf);anim.name=null;R=null;$('#runner').hidden=true;$('#r-toggle').hidden=false;$('#r-skip').hidden=false;
  $('#r-stop').setAttribute('aria-label','Завершить');try{wake&&wake.release()}catch(e){};wake=null;show(view)}
function paint(){const st=R.steps[R.i];
  const ph=$('#r-phase');ph.className='phase '+st.type;ph.textContent=st.type==='work'?'Работа':st.type==='rest'?'Отдых':'Приготовьтесь';
  $('#r-clock').textContent=mmss(R.left);
  $('#r-ex').textContent=st.type==='work'?st.name:st.type==='prep'?(R.steps[1]?.name||''):st.name;
  const showItem=st.type==='work'?st:R.steps.slice(R.i+1).find(x=>x.type==='work');
  const tipItem=st.type==='work'?st:st.type==='prep'?R.steps[1]:null;$('#r-tip').textContent=tipItem&&tipItem.tip||'';
  if(showItem)setRunnerFig(showItem.name);
  const vb=$('#r-video');if(showItem){vb.href=videoUrl(showItem);vb.hidden=false}else vb.hidden=true;
  const frac=Math.max(0,R.left/st.dur);const arc=$('#r-arc');
  arc.style.strokeDashoffset=(339.29*(1-frac)).toFixed(1);
  arc.setAttribute('stroke',st.type==='work'?'var(--work)':st.type==='rest'?'var(--rest)':'var(--muted)');
  const nxt=R.steps.slice(R.i+1).find(s=>s.type==='work');
  $('#r-next').innerHTML=nxt?(st.type==='work'?'Далее: ':'Следующее: ')+'<b>'+esc(nxt.name)+'</b>':'Последнее упражнение';
  $('#r-round').textContent='Круг '+st.round+'/'+R.p.rounds;
  const works=R.steps.filter(s=>s.type==='work').length;
  $('#r-step').textContent='Упр. '+Math.min(works,R.done+(st.type==='work'?1:0))+'/'+works;
  const remaining=R.left+R.steps.slice(R.i+1).reduce((a,s)=>a+s.dur,0);
  $('#r-left').textContent='Осталось '+mmss(remaining);
  const total=R.steps.reduce((a,s)=>a+s.dur,0);$('#r-bar').style.width=((1-remaining/total)*100).toFixed(1)+'%';
  $('#r-toggle').innerHTML=R.paused?ICON_PLAY:ICON_PAUSE;$('#r-toggle').setAttribute('aria-label',R.paused?'Продолжить':'Пауза');
}
$('#r-toggle').onclick=()=>{if(!R)return;R.paused=!R.paused;R.last=performance.now();paint()};
$('#r-skip').onclick=()=>{if(R&&!R.finished)next()};
$('#r-stop').onclick=()=>{if(!R)return;if(R.finished)closeRunner();else finish(false)};
$('#r-sound').onclick=()=>{soundOn=!soundOn;store.set('ct-sound',soundOn);$('#r-sound').textContent='Звук: '+(soundOn?'вкл':'выкл')};
document.addEventListener('keydown',e=>{if(!R||R.finished)return;if(e.code==='Space'){e.preventDefault();$('#r-toggle').click()}if(e.code==='ArrowRight')next()});
document.addEventListener('visibilitychange',()=>{if(R&&!R.finished&&document.visibilityState==='visible')lockScreen()});

renderPrograms();
initCloud();
if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
</body>
