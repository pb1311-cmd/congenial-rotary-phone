<title>Вход · 3D-планировщик квартиры</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Manrope,system-ui,sans-serif;background:#ece8e1;color:#24211d}
body{display:grid;place-items:center;padding:20px}
form{width:100%;max-width:360px;background:#fffdfa;border:1px solid #e6e1d9;border-radius:18px;padding:26px 22px;box-shadow:0 10px 40px rgba(0,0,0,.08)}
h1{font-size:19px;margin:0 0 4px}
p{font-size:13px;color:#7a736a;margin:0 0 18px;line-height:1.45}
label{display:block;font-size:12px;color:#7a736a;margin:12px 0 5px;font-weight:600}
input[type=text],input[type=password]{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid #ddd6cb;border-radius:10px;background:#fff}
input:focus{outline:2px solid #2f6fdb;outline-offset:-1px;border-color:transparent}
.ck{display:flex;gap:8px;align-items:center;font-size:13px;margin:14px 0 4px;color:#24211d;font-weight:400}
button{width:100%;margin-top:16px;font:inherit;font-size:15px;font-weight:700;padding:12px;border:0;border-radius:10px;background:#2f6fdb;color:#fff;cursor:pointer}
button:disabled{opacity:.6}
#err{color:#c4442f;font-size:13px;min-height:18px;margin-top:10px}
</style>
</head>
<body>
<form id="f" autocomplete="on">

  <p>Доступ только по приглашению. Введите логин и пароль, которые вам прислали.</p>

  <input type="text" id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
  <label for="p">Пароль</label>
  <input type="password" id="p" name="password" autocomplete="current-password" required>
  <label class="ck"><input type="checkbox" id="rem" checked> Запомнить на этом устройстве</label>
  <button id="b" type="submit">Войти</button>
  <div id="err"></div>
</form>

var KEYSTORE = 'kv3d-access-key';
function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function toB64(buf){var a=new Uint8Array(buf),s='';for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
async function deriveRaw(user,pass){
  var mat=await crypto.subtle.importKey('raw',new TextEncoder().encode(user.trim().toLowerCase()+':'+pass),'PBKDF2',false,['deriveBits']);
  return crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(PAYLOAD.salt),iterations:PAYLOAD.iter,hash:'SHA-256'},mat,256);
}
async function open_(raw){
  var key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(PAYLOAD.iv)},key,b64(PAYLOAD.ct));
  var html=new TextDecoder().decode(plain);
  document.open();document.write(html);document.close();
}
var f=document.getElementById('f'),err=document.getElementById('err'),btn=document.getElementById('b');
if(!window.crypto||!crypto.subtle){err.textContent='Браузер слишком старый. Откройте ссылку в свежем Chrome, Safari или Firefox.';btn.disabled=true;}
(async function(){
  try{var saved=localStorage.getItem(KEYSTORE);if(saved){await open_(b64(saved));}}catch(e){try{localStorage.removeItem(KEYSTORE);}catch(_){}}
})();
f.addEventListener('submit',async function(e){
  e.preventDefault();err.textContent='';btn.disabled=true;btn.textContent='Проверяю…';
  try{
    var raw=await deriveRaw(document.getElementById('u').value,document.getElementById('p').value);
    try{if(document.getElementById('rem').checked)localStorage.setItem(KEYSTORE,toB64(raw));}catch(_){}
    await open_(raw);
  }catch(ex){
    try{localStorage.removeItem(KEYSTORE);}catch(_){}
    err.textContent='Неверный логин или пароль';btn.disabled=false;btn.textContent='Войти';
  }
});
